    function renderDims() {
      const DC = '#7d7160', LS = `stroke="${DC}" stroke-width="1" vector-effect="non-scaling-stroke"`, TK = `stroke="${DC}" stroke-width="2" vector-effect="non-scaling-stroke"`;
      const txt = (x, y, v, rot) => `<text x="${x}" y="${y}" font-size="${v < 400 ? 140 : 200}" text-anchor="middle" fill="${DC}" ${rot ? `transform="rotate(-90 ${x} ${y})"` : ''}>${v}</text>`;
      const chain = (horiz, at, start, segs) => {
        const pts = [start]; segs.forEach(v => pts.push(pts[pts.length - 1] + v));
        let s = horiz ? `<line x1="${pts[0]}" y1="${at}" x2="${pts.at(-1)}" y2="${at}" ${LS}/>` : `<line x1="${at}" y1="${pts[0]}" x2="${at}" y2="${pts.at(-1)}" ${LS}/>`;
        pts.forEach(p => s += horiz
          ? `<line x1="${p}" y1="${at - 170}" x2="${p}" y2="${at + 170}" ${LS}/><line x1="${p - 80}" y1="${at + 80}" x2="${p + 80}" y2="${at - 80}" ${TK}/>`
          : `<line x1="${at - 170}" y1="${p}" x2="${at + 170}" y2="${p}" ${LS}/><line x1="${at - 80}" y1="${p + 80}" x2="${at + 80}" y2="${p - 80}" ${TK}/>`);
        segs.forEach((v, i) => { const mid = (pts[i] + pts[i + 1]) / 2; s += horiz ? txt(mid, at - 70, v) : txt(at - 70, mid, v, true); });
        return s;
      };
      const g = $('#gDims');
      let html = '';
      if (Object.keys(state.rooms).length) {                  // 空方案没有户型，不显示尺寸标注
        const segs = [...WALLS.map((w, i) => 'w' + i), ...state.walls.map(w => 'CW' + w.id)].map(openingWallGeom).filter(Boolean);
        const H = segs.filter(s => Math.abs(s.u[1]) < .02), V = segs.filter(s => Math.abs(s.u[0]) < .02);   // 横墙 / 竖墙（斜墙不进尺寸链）
        if (H.length && V.length) {
          const minX = Math.min(...segs.map(s => Math.min(s.A[0], s.B[0]) - s.T / 2)), maxX = Math.max(...segs.map(s => Math.max(s.A[0], s.B[0]) + s.T / 2));
          const minY = Math.min(...segs.map(s => Math.min(s.A[1], s.B[1]) - s.T / 2)), maxY = Math.max(...segs.map(s => Math.max(s.A[1], s.B[1]) + s.T / 2));
          const bps = arr => {                                 // 断点：去重、排序、丢掉 <5mm 的碎段
            const a = [...new Set(arr.map(v => Math.round(v)))].sort((p, q) => p - q), out = [a[0]];
            a.slice(1).forEach(v => { if (v - out[out.length - 1] > 5) out.push(v); });
            return out;
          };
          const chainSegs = (walls, axis, lo, hi) => {         // 该外侧边的分段：外角 + 撞上来的内墙厚度
            const pts = walls.flatMap(w => { const c = (w.A[axis] + w.B[axis]) / 2; return [c - w.T / 2, c + w.T / 2]; });
            const bp = bps([lo, ...pts, hi]);

          };

          const top = chainSegs(V.filter(w => Math.min(w.A[1], w.B[1]) - w.T / 2 < minY + E), 0, minX, maxX);
          const bot = chainSegs(V.filter(w => Math.max(w.A[1], w.B[1]) + w.T / 2 > maxY - E), 0, minX, maxX);
          const lef = chainSegs(H.filter(w => Math.min(w.A[0], w.B[0]) - w.T / 2 < minX + E), 1, minY, maxY);
          const rig = chainSegs(H.filter(w => Math.max(w.A[0], w.B[0]) + w.T / 2 > maxX - E), 1, minY, maxY);

            chain(true, maxY + 790, minX, bot) + chain(true, maxY + 1290, minX, [W]) +
            chain(false, minX - 800, minY, lef) + chain(false, minX - 1300, minY, [Hh]) +
            chain(false, maxX + 900, minY, rig) + chain(false, maxX + 1400, minY, [Hh]);

      g.setAttribute('display', ui.layers.dims ? 'inline' : 'none');

    function renderGrid() {

    // 坐标基准轴：贴在图纸左下角（跟着图纸平移 / 缩放 / 旋转），原点小方框 + 向右的 X 轴、向上的 Y 轴
    function renderAxes() {

      if (!isFinite(x0)) { x0 = 0; y1 = 0; }
      const k = 1 / view.s, rot = view.rot || 0, A = 44 * k, S = 9 * k, C = '#2f5d62';

      const TXT = (x, y, str) => `<text x="${x}" y="${y}" font-size="${12 * k}" text-anchor="middle" fill="${C}" font-weight="600"
        stroke="#fff" stroke-width="${3 * k}" paint-order="stroke" transform="rotate(${-rot} ${x} ${y})">${str}</text>`;
      g.innerHTML = `<g transform="translate(${x0} ${y1})">

        <line x1="${S / 2}" y1="0" x2="${A}" y2="0" ${ST}/>                             <!-- X 轴 -->
        <line x1="0" y1="${-S / 2}" x2="0" y2="${-A}" ${ST}/>                           <!-- Y 轴 -->

    function renderMeasure() {
      const k = 1 / view.s, fs = 12 * k;
      const one = (a, b, tmp) => {
        const L = Math.hypot(b.x - a.x, b.y - a.y); if (L < 1) return '';
        let ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI; if (ang > 90 || ang < -90) ang += 180;
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, nx = -(b.y - a.y) / L * 5 * k, ny = (b.x - a.x) / L * 5 * k;
        const col = tmp ? '#2f5d62' : '#b5653a', S = `stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"`;
        return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" ${S}/>
      <line x1="${a.x - nx}" y1="${a.y - ny}" x2="${a.x + nx}" y2="${a.y + ny}" ${S}/><line x1="${b.x - nx}" y1="${b.y - ny}" x2="${b.x + nx}" y2="${b.y + ny}" ${S}/>
      <text x="${mx}" y="${my - 5 * k}" font-size="${fs}" text-anchor="middle" fill="${col}" font-weight="600" transform="rotate(${ang} ${mx} ${my})"
        stroke="#fff" stroke-width="${3.5 * k}" paint-order="stroke">${Math.round(L)} mm</text>`;
      };
      let s = state.measures.map(m => one(m.a, m.b)).join('');
      if (ui.mA && ui.mCur) s += one(ui.mA, ui.mCur, true);
      if (ui.mA) s += `<circle cx="${ui.mA.x}" cy="${ui.mA.y}" r="${3 * k}" fill="#2f5d62"/>`;

    function noteBBox(n) {                                          // 文字标注的近似范围（mm）
      const fs = +n.size || 300, w = Math.max(160, String(n.text || '').length * fs * .62);
      return [n.x - w / 2, n.y - fs * .65, n.x + w / 2, n.y + fs * .65];
    }

    function dimPanel(d) {
      const g = dimGeom(d), ang = Math.atan2(g.b[1] - g.a[1], g.b[0] - g.a[0]) * 180 / Math.PI;
      return `<section><h3>${tr('尺寸标注', 'Dimension')}</h3>
    <div class="form">

      <label>${tr('长度', 'Length')} (mm)<div style="padding:5px 0;font-variant-numeric:tabular-nums">${Math.round(g.L)}</div></label>
      <label>${tr('起点', 'Start')} X (mm)<input type="number" id="dmAX" value="${Math.round(d.a[0])}" step="10"></label>
      <label>${tr('起点', 'Start')} Y (mm)<input type="number" id="dmAY" value="${Math.round(d.a[1])}" step="10"></label>
      <label>${tr('终点', 'End')} X (mm)<input type="number" id="dmBX" value="${Math.round(d.b[0])}" step="10"></label>
      <label>${tr('终点', 'End')} Y (mm)<input type="number" id="dmBY" value="${Math.round(d.b[1])}" step="10"></label>
    </div>
    <div class="muted" style="margin-top:8px">${tr(`与水平方向约 ${Math.round(ang)}°。偏移为正时标注线偏向起点→终点方向的左侧；在图上拖动可整体移动。`, `About ${Math.round(ang)}° from horizontal. Positive offset puts the dimension line on the left of start → end; drag on the plan to move it.`)}</div>
    <div class="actions"><button class="btn danger" id="aDel">${tr('删除', 'Delete')}</button><button class="btn" id="back">${tr('← 返回', '← Back')}</button></div></section>`;
    }
    function bindDimPanel(d) {
      const num = (k, fn) => {
        const el = $('#' + k); if (!el) return;
        el.onchange = e => {
          const v = parseFloat(e.target.value); if (isNaN(v)) return;
          mutate(() => { const g = (state.dims || []).find(x => x.id === d.id); if (g) fn(g, Math.round(v / 10) * 10); });
        };
      };
      num('dmOff', (g, v) => g.off = Math.max(-2000, Math.min(2000, v)));
      num('dmAX', (g, v) => g.a = [v, g.a[1]]);

    /* ======================= 操作 ======================= */

    const getS = id => (state.stairs || []).find(x => x.id === id);

    const getW = id => state.walls.find(w => 'CW' + w.id === id);
    function objBBox(it) {                                          // 单个对象的轴对齐包围盒 [x0,y0,x1,y1]（世界坐标）
      if (it.kind === 'furn') {
        const f = getF(it.id); if (!f) return null;
        const { hw, hh } = aabb(f); return [f.cx - hw, f.cy - hh, f.cx + hw, f.cy + hh];
      }
      if (it.kind === 'stair') {
        const s = getS(it.id); if (!s) return null;
        const bb = stairBBox(stairLayout(s)), a = s.dir * Math.PI / 180, c = Math.cos(a), sn = Math.sin(a);

          const X = s.x + lx * c - lz * sn, Y = s.y + lx * sn + lz * c;

      }
      if (it.kind === 'wall') {

        const t = cwT(w) / 2;
        return [Math.min(w.a[0], w.b[0]) - t, Math.min(w.a[1], w.b[1]) - t, Math.max(w.a[0], w.b[0]) + t, Math.max(w.a[1], w.b[1]) + t];
      }
      if (it.kind === 'room') {                                     // 房间区域（地面）

      const c0 = getP(it.id); if (!c0) return null;

    function objectsInRect(mq) {                                    // 框选命中：家具 / 楼梯 / 柱子 / 自画墙（相交即选）+ 房间区域（整间框住才选）

      const out = [], hit = it => { const b = objBBox(it); return b && b[0] <= x1 && b[2] >= x0 && b[1] <= y1 && b[3] >= y0; };
      state.furniture.forEach(f => { const it = { kind: 'furn', id: f.id }; if (hit(it)) out.push(it); });
      (state.stairs || []).forEach(s => { const it = { kind: 'stair', id: s.id }; if (hit(it)) out.push(it); });
      (state.pillars || []).forEach(c => { const it = { kind: 'pillar', id: c.id }; if (hit(it)) out.push(it); });
      state.walls.forEach(w => { const it = { kind: 'wall', id: 'CW' + w.id }; if (hit(it)) out.push(it); });   // 只框自画墙（内置墙是结构墙，不参与整组搬移）
      allRooms().forEach(r => {                                     // 房间地面要整间框住才选入，免得随便框两件家具把地面也带走
        if (!state.rooms[r.id]) return;
        const b = bbox(r.poly);
        if (b[0] >= x0 && b[2] <= x1 && b[1] >= y0 && b[3] <= y1) out.push({ kind: 'room', id: r.id });

      return out;
    }
    function multiHit(t) {                                          // 按下的对象是否属于当前多选（属于 → 整体拖动）
      if (ui.multi.length < 2) return null;
      const el = t.closest('[data-fid],[data-stair],[data-pillar],[data-wall],[data-room]'); if (!el) return null;
      const d = el.dataset, kind = d.fid ? 'furn' : d.stair ? 'stair' : d.pillar ? 'pillar' : d.room ? 'room' : 'wall';
      const id = d.fid || d.stair || d.pillar || d.room || d.wall;
      return ui.multi.some(s => s.kind === kind && s.id === id) ? { kind, id } : null;
    }
    function multiBBox() {                                          // 框选所有对象的整体包围盒
      const bs = ui.multi.map(s => objBBox(s)).filter(Boolean);
      if (!bs.length) return null;
      return [Math.min(...bs.map(b => b[0])), Math.min(...bs.map(b => b[1])), Math.max(...bs.map(b => b[2])), Math.max(...bs.map(b => b[3]))];

    function inMultiArea(p) {                                       // 按下点是否落在框选范围里（含 8px 容差：贴着边按也算）

    function deleteSel() {

    function dropPoint(x, y) {
      const r = $('#stage').getBoundingClientRect();
      if (x < r.left || x > r.right || y < r.top || y > r.bottom) return null;
      if (document.elementFromPoint(x, y)?.closest('aside.open,#fab,#walkOverlay,#joy,#walkExit')) return null;
      if (is3D()) return window.View3D?.groundAt(x, y) || null;

      if (!libDrag || e.pointerId !== libDrag.id) return;

      const g = libDrag.ghost, s = Math.max(dropPoint(e.clientX, e.clientY)?.s || (is3D() ? .05 : view.s), .02);
      Object.assign(g.style, { width: Math.max(28, it[2] * s) + 'px', height: Math.max(20, it[3] * s) + 'px', left: e.clientX + 'px', top: e.clientY + 'px' });

    function svgToPngBlob(W) {
      return new Promise((resolve, reject) => {
        const clone = svg.cloneNode(true), H = Math.round(W * BOUNDS.h / BOUNDS.w);
        clone.setAttribute('viewBox', `${BOUNDS.x} ${BOUNDS.y} ${BOUNDS.w} ${BOUNDS.h}`);
        clone.setAttribute('width', W); clone.setAttribute('height', H);
        clone.querySelector('#gSel').innerHTML = '';
        clone.querySelector('#gGrid').innerHTML = `<rect x="-20000" y="-20000" width="55000" height="55000" fill="${ui.layers.grid ? 'url(#grid)' : '#f7f4ee'}"/>`;
        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        Object.entries({ x: -20000, y: -20000, width: 55000, height: 55000, fill: '#f7f4ee' }).forEach(([k, v]) => bg.setAttribute(k, v));
        clone.insertBefore(bg, clone.querySelector('#gGrid'));
        const img = new Image();
        img.onload = () => {
          try {
            const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
            cv.getContext('2d').drawImage(img, 0, 0, W, H);
            cv.toBlob(b => b ? resolve(b) : reject(new Error('PNG encoding failed')), 'image/png');
          } catch (e) { reject(e); }
        };
        img.onerror = () => reject(new Error('SVG rasterization failed'));
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
      });
    }

          `<button data-kind="${it.kind}" data-oid="${it.id}" class="${ui.sel?.kind === it.kind && ui.sel?.id === it.id ? 'on' : ''}">
           <span>${esc(it.name)}</span><small>${it.sub}</small></button>`).join('')
        : '';
      panel.innerHTML = `<div class="obj-head" id="objHead"><b>▤ ${tr('对象列表', 'Objects')}</b><span class="obj-toggle">${objCollapsed ? '▸' : '▾'}</span></div><div class="obj-body"${objCollapsed ? ' style="display:none"' : ''}>`
        + sec(tr('房间', 'Rooms'), rooms) + sec(tr('墙体', 'Walls'), walls) + sec(tr('门窗', 'Doors / Windows'), opens) + sec(tr('家具', 'Furniture'), furn)
        + (!rooms.length && !walls.length && !opens.length && !furn.length ? `<div class="muted" style="padding:6px">${tr('画板是空的', 'The plan is empty')}</div>` : '')
        + '</div>';
      panel.querySelectorAll('button[data-kind]').forEach(b => b.onclick = () => focusObj(b.dataset.kind, b.dataset.oid));
      $('#objHead').onclick = () => { objCollapsed = !objCollapsed; renderObjList(); };   // 点标题收起 / 展开
    }
    function objCenter(kind, id) {
      if (kind === 'room') { const r = ROOMS.find(r => r.id === id); if (!r) return null; const b = bbox(r.poly); return { x: (b[0] + b[2]) / 2, y: (b[1] + b[3]) / 2 }; }
      if (kind === 'wall') {
        if (id.startsWith('CW')) { const w = state.walls.find(x => 'CW' + x.id === id); return w && { x: (w.a[0] + w.b[0]) / 2, y: (w.a[1] + w.b[1]) / 2 }; }
        const r = wallRectOf(+id.slice(1)); return r && { x: (r[0] + r[2]) / 2, y: (r[1] + r[3]) / 2 };
      }
      if (kind === 'bopen') { const r = bopenRect(id); return r && { x: (r[0] + r[2]) / 2, y: (r[1] + r[3]) / 2 }; }
      if (kind === 'open') {
        const o = state.openings.find(x => x.id === id), g = o && openingWallGeom(o.wall);
        return g && { x: g.A[0] + g.u[0] * (o.c + o.w / 2), y: g.A[1] + g.u[1] * (o.c + o.w / 2) };
      }
      if (kind === 'furn') { const f = getF(id); return f && { x: f.cx, y: f.cy }; }
    }
    function focusObj(kind, id) {
      if (ui.tool === 'measure') return;                                  // 测量中不响应
      if (ui.tool !== 'draw' && kind !== 'room') return;                  // 预览模式只允许选房间；其它对象仅设计模式
      if (ui.tool === 'draw' && ui.drawTool !== 'select') setSubTool('select');   // 画墙/开门/开窗中 → 回选择子工具
      select({ kind, id });                                               // 只选中，不动视图（画板不平移）
      renderObjList();
    }

    $('#zoomIn').onclick = () => zoomCenter(1.25);
    $('#zoomOut').onclick = () => zoomCenter(.8);
    $('#fit').onclick = fitView;
    document.querySelectorAll('#rotPad .rotarrow').forEach(b => b.onclick = () => setRot(+b.dataset.rot));   // 四个箭头 = 四个朝向
    $('#rotDeg').onclick = rotateView;                             // 圆心中间：顺时针转 90°
    $('#s60').onclick = () => { setRatio(60); toast(tr('已按 1:60 显示（与原始户型图同比例）', 'Showing at 1:60 (same scale as the original plan)')); };
    $('#s100').onclick = () => setRatio(100);
    $('#undo').onclick = undo; $('#redo').onclick = redo;
    $('#clearAll').onclick = clearLayout;

    /* 全屏：标准 API + Safari（iPad）的 webkit 前缀版本 */
    const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
    function toggleFullscreen() {
      const de = document.documentElement;
      if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else {
        const req = de.requestFullscreen || de.webkitRequestFullscreen;
        if (!req) return toast(tr('当前浏览器不支持网页全屏，可在 Safari 中「添加到主屏幕」后以全屏方式打开', 'Fullscreen is not supported here — in Safari, use "Add to Home Screen" to open it fullscreen'));
        Promise.resolve(req.call(de)).catch(() => toast(tr('无法进入全屏', 'Could not enter fullscreen')));
      }
    }
    function syncFullscreen() {
      const on = !!fsEl(), b = $('#fullscreen');
      b.textContent = '⛶ ' + (on ? tr('退出全屏', 'Exit fullscreen') : tr('全屏', 'Fullscreen'));
      b.title = (on ? tr('退出全屏', 'Exit fullscreen') : tr('全屏', 'Fullscreen')) + ' (Shift+F)';
    }
    $('#fullscreen').onclick = toggleFullscreen;
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(t => document.addEventListener(t, syncFullscreen));
    // 已从主屏幕以独立 App 方式打开时本就是全屏，隐藏按钮
    if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) $('#fullscreen').hidden = true;
    $('#tgLib').onclick = () => drawer('lib');
    $('#tgPanel').onclick = () => drawer('panel');
    // 触屏上点菜单以外的地方收起「文件」菜单
    document.addEventListener('pointerdown', e => { const m = $('details.menu'); if (m.open && !m.contains(e.target)) m.open = false; });
    matchMedia('(max-width:1100px)').addEventListener('change', () => drawer(null));
    drawer(null);                                  // 恢复上次的面板收起状态
    $('#exportPng').onclick = exportPNG;
    $('#exportJson').onclick = () => download(tr('户型装修方案', 'floor-plan-design') + '.json', new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
    $('#importJson').onclick = () => $('#fileIn').click();
    $('#fileIn').onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      file.text().then(txt => {
        try { const s = JSON.parse(txt); if (!Array.isArray(s.furniture)) throw 0; applyLayers(s); const b = snap(); state = fixState(s); ui.sel = null; commit(b); markDirty(false); renderAll(); syncPlanName(file.name.replace(/\.json$/i, '')); toast(tr('方案已导入', 'Plan imported')); }
        catch (err) { toast(tr('文件格式不正确', 'Invalid file format')); }
      });
      e.target.value = '';
    };
    $('#reset').onclick = async () => { if (await uiConfirm(tr('恢复为默认设计方案？（可撤销）', 'Reset to the default design? (undoable)'))) { const b = snap(); state = defaultState(); ui.sel = null; commit(b); renderAll(); syncPlanName(''); } };

    $('#newPlan').onclick = async () => {
      if (!await uiConfirm(tr('新建完全空白的方案？（清空房间、墙体、门窗与家具，从零开始；当前布置可 Ctrl+Z 恢复）', 'Create a truly blank plan? (rooms, walls, doors / windows and furniture all cleared; Ctrl+Z restores the current layout)'))) return;
      const b = snap();
      state = blankState();
      ui.sel = null; commit(b); markDirty(false); renderAll(); syncPlanName('');
      toast(tr('已新建空白方案，可用「设计 → 画墙」从零搭建', 'Blank plan created — draw walls in "Design" mode'));
    };

    /* ======================= 服务器方案（Python 后端 /api/plans） ======================= */
    const planURL = n => '/api/plans/' + encodeURIComponent(n);
    const cloudLoad = (s, name) => { applyLayers(s); const b = snap(); state = fixState(s); ui.sel = null; commit(b); markDirty(false); renderAll(); syncPlanName(name || ''); toast(tr('方案已打开', 'Plan loaded')); };
    const cloudFail = () => toast(tr('操作失败：请确认程序已启动', 'Failed — make sure the app is running'));

    /* 自动保存：改动后 2 秒写入「自动保存」槽位（静默进行，失败不打扰，下次改动再试） */
    const AUTO_NAME = '自动保存';
    let autoSaveT = null, autoSaved = '';
    function scheduleAutoSave() { clearTimeout(autoSaveT); autoSaveT = setTimeout(autoSave, 2000); }
    async function autoSave() {
      const cur = JSON.stringify({ ...state, layers: ui.layers });
      if (cur === autoSaved) return;
      try {
        const r = await fetch(planURL(AUTO_NAME), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: cur, keepalive: true });
        if (r.ok) autoSaved = cur;
      } catch (e) { }
    }
    /* 关闭 / 切走页面时把未写入的改动立即落盘（keepalive 让请求在页面关闭后仍能发完） */
    addEventListener('beforeunload', () => { if (autoSaveT) { clearTimeout(autoSaveT); autoSaveT = null; autoSave(); } });
    document.addEventListener('visibilitychange', () => { if (document.hidden && autoSaveT) { clearTimeout(autoSaveT); autoSaveT = null; autoSave(); } });

    /* 应用内确认弹窗（替代原生 confirm），返回 Promise<boolean>；消息支持 \n 换行 */
    function uiConfirm(msg, okText, cancelText) {
      return new Promise(resolve => {
        let mask = $('#askMask');
        if (!mask) {
          mask = document.createElement('div'); mask.id = 'askMask';
          mask.innerHTML = `<div id="askBox"><div id="askMsg"></div><div id="askFoot"><button class="btn" id="askCancel"></button><button class="btn primary" id="askOk"></button></div></div>`;
          document.body.appendChild(mask);
        }
        const done = v => { mask.classList.remove('open'); resolve(v); };
        mask.querySelector('#askMsg').textContent = msg;
        const okB = mask.querySelector('#askOk'), cB = mask.querySelector('#askCancel');
        okB.textContent = okText || tr('确定', 'OK');
        cB.textContent = cancelText || tr('取消', 'Cancel');
        okB.onclick = () => done(true);
        cB.onclick = () => done(false);
        mask.classList.add('open');
        okB.focus();
      });
    }

    /* 方案弹窗骨架：标题 + 副标题 + 可选名称输入行 + 方案列表 + 底部按钮；mode: 'save' | 'open' */
    function cloudMask(mode) {
      let mask = $('#cloudMask');
      if (!mask) {
        mask = document.createElement('div'); mask.id = 'cloudMask';
        mask.innerHTML = `<div id="cloudBox"><button id="cloudX" title="关闭">×</button><b id="cloudTitle"></b><div id="cloudSub" class="welcome-sub"></div><div id="cloudNameRow"><label id="cloudNameLabel" for="cloudName"></label><input id="cloudName" maxlength="80" autocomplete="off"></div><div id="cloudList"></div><div id="cloudFoot"><button class="btn" id="cloudImport"></button><button class="btn" id="cloudOk"></button></div></div>`;
        document.body.appendChild(mask);
      }
      // 点弹窗外部不关闭，只能通过按钮退出
      mask.querySelector('#cloudX').onclick = () => mask.classList.remove('open');
      const save = mode === 'save';
      mask.querySelector('#cloudBox').classList.toggle('welcome', !save);
      mask.querySelector('#cloudList').classList.toggle('grid', !save);
      mask.querySelector('#cloudList').classList.toggle('rows', save);
      mask.querySelector('#cloudSub').style.display = '';
      mask.querySelector('#cloudNameRow').style.display = save ? 'flex' : 'none';
      mask.querySelector('#cloudOk').style.display = save ? '' : 'none';
      mask.querySelector('#cloudImport').style.display = save ? 'none' : '';
      return mask;
    }

    /* 保存方案：弹窗内输入名称，点选已有方案行即为覆盖（同名时二次确认） */
    $('#cloudSave').onclick = async () => {
      let plans;
      try { const r = await fetch('/api/plans'); if (!r.ok) throw 0; plans = await r.json(); }
      catch (e) { cloudFail(); return; }
      const mask = cloudMask('save');
      mask.querySelector('#cloudTitle').textContent = tr('保存方案', 'Save plan');
      mask.querySelector('#cloudSub').textContent = tr('为当前设计取个名称保存；点击已有方案可覆盖保存', 'Name this design and save it — or click an existing plan to overwrite it');
      mask.querySelector('#cloudNameLabel').textContent = tr('方案名称', 'Plan name');
      const nameEl = mask.querySelector('#cloudName');
      nameEl.placeholder = tr('例如：客厅改造方案', 'e.g. Living room remodel');
      nameEl.setAttribute('aria-label', tr('方案名称', 'Plan name'));
      nameEl.value = planName && planName !== AUTO_NAME ? planName : tr('我的方案', 'My plan');
      const listEl = mask.querySelector('#cloudList');
      const others = plans.filter(p => p.name !== AUTO_NAME);
      listEl.innerHTML = `<div class="cloud-sec-title"></div><div class="cloud-rows"></div>`;
      listEl.querySelector('.cloud-sec-title').textContent = tr('已有方案（点击可覆盖）', 'Existing plans (click to overwrite)');
      const rowsEl = listEl.querySelector('.cloud-rows');
      if (!others.length) rowsEl.innerHTML = `<div class="muted">${tr('还没有保存过方案，输入名称即可保存为新方案', 'No plans yet — type a name to save a new one')}</div>`;
      else for (const p of others) {
        const row = document.createElement('div'); row.className = 'cloud-row';
        row.innerHTML = `<span class="th"><span></span></span><span class="info"><span class="nm"></span><span class="tm"></span></span>`;
        const th = row.querySelector('.th');
        th.querySelector('span').textContent = tr('无预览', '—');
        if (p.thumbnail) {
          const img = new Image();
          img.alt = '';
          img.onload = () => th.replaceChildren(img);
          img.src = p.thumbnail;
        }
        row.querySelector('.nm').textContent = p.name;
        row.querySelector('.tm').textContent = new Date(p.mtime * 1000).toLocaleString();
        if (p.name === planName) row.classList.add('sel');
        row.onclick = () => {
          rowsEl.querySelectorAll('.cloud-row.sel').forEach(x => x.classList.remove('sel'));
          row.classList.add('sel');
          nameEl.value = p.name;
          syncOk();
        };
        rowsEl.appendChild(row);
      }
      const okB = mask.querySelector('#cloudOk');
      okB.classList.add('primary');
      const syncOk = () => {
        const name = nameEl.value.trim();
        const hit = name !== planName && others.some(p => p.name === name);
        okB.textContent = hit ? tr('覆盖保存', 'Overwrite') : tr('保存', 'Save');
      };
      nameEl.oninput = syncOk;
      syncOk();
      okB.onclick = async () => {
        if (okB.disabled) return;
        const name = nameEl.value.trim();
        if (!name) { toast(tr('请输入方案名称', 'Please enter a plan name')); return; }
        if (name === AUTO_NAME) { toast(tr('该名称保留给自动保存，请换一个', 'Reserved for autosave — pick another')); return; }
        if (plans.some(p => p.name === name) && name !== planName &&
            !await uiConfirm(tr('已存在同名方案「' + name + '」，覆盖它？', 'A plan named "' + name + '" already exists. Overwrite?'), tr('覆盖', 'Overwrite'))) return;
        okB.disabled = true;
        try {
          const thumbSaved = await savePlanTo(name);
          mask.classList.remove('open');
          toast(thumbSaved ? tr('已保存：' + name, 'Saved: ' + name) : tr('已保存：' + name + '（缩略图保存失败）', 'Saved: ' + name + ' (thumbnail failed)'));
        } catch (e) { cloudFail(); }
        finally { okB.disabled = false; }
      };
      nameEl.onkeydown = e => { if (e.key === 'Enter') okB.onclick(); };
      mask.classList.add('open');
      nameEl.focus(); nameEl.select();
    };

    /* 直接写入指定名称的方案（JSON + 缩略图），返回缩略图是否保存成功 */
    async function savePlanTo(name) {
      const body = JSON.stringify({ ...state, layers: ui.layers });
      let thumb = null;
      try { thumb = await svgToPngBlob(480); } catch (e) { }
      const r = await fetch(planURL(name), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body });
      if (!r.ok) throw 0;
      let thumbSaved = !!thumb;
      if (thumb) {
        try {
          const res = await fetch(planURL(name) + '/thumbnail', { method: 'PUT', headers: { 'Content-Type': 'image/png' }, body: thumb });
          if (!res.ok) throw 0;
        } catch (e) { thumbSaved = false; }
      }
      syncPlanName(name);
      markDirty(false);
      return thumbSaved;
    }

    /* 顶部「保存」/ Ctrl+S：已命名方案静默覆盖保存，未命名则打开保存弹窗 */
    let quickSaving = false;
    async function quickSave() {
      if (quickSaving) return;
      if (!planName || planName === AUTO_NAME) { $('#cloudSave').click(); return; }
      quickSaving = true;
      try { await savePlanTo(planName); }
      catch (e) { cloudFail(); }
      finally { quickSaving = false; }
    }
    $('#quickSave').onclick = quickSave;

    $('#closePlan').onclick = async () => {
      if ((planName || state.furniture.length || state.walls.length || Object.keys(state.rooms).length) &&
          !await uiConfirm(tr('关闭当前方案并回到空白画板？\n服务器上已保存的方案不受影响；尚未保存的修改会丢失。', 'Close the current plan and return to a blank canvas?\nSaved plans on the server are not affected; unsaved changes will be lost.'))) return;

    /* 欢迎界面：方案卡片网格 + 新建/导入入口；silent=true 时不弹错误提示（用于启动时） */
    async function showWelcome(silent = false) {

        card.innerHTML = `<div class="pc-del"></div><div class="pc-thumb"><span></span></div><div class="pc-nm"></div><div class="pc-tm"></div>`;
        const thumbBox = card.querySelector('.pc-thumb');
        thumbBox.querySelector('span').textContent = tr('暂无预览', 'No preview');
        if (p.thumbnail) {
          const img = new Image();
          img.alt = tr('方案预览：' + p.name, 'Plan preview: ' + p.name);
          img.onload = () => thumbBox.replaceChildren(img);
          img.src = p.thumbnail;
        }
        card.querySelector('.pc-nm').textContent = draft ? tr('自动保存（草稿）', 'Autosave (draft)') : p.name;
        if (p.name === planName) {
          card.classList.add('cur');
          const b = document.createElement('span'); b.className = 'pc-badge';
          b.textContent = tr('当前', 'Current');
          card.querySelector('.pc-nm').appendChild(b);

        card.querySelector('.pc-del').onclick = async ev => {
          ev.stopPropagation();
          if (!await uiConfirm(tr('确定删除方案「' + p.name + '」？此操作不可恢复。', 'Delete plan "' + p.name + '"? This cannot be undone.'), tr('删除', 'Delete'))) return;
          try { const r = await fetch(planURL(p.name), { method: 'DELETE' }); if (!r.ok) throw 0; }
          catch (e) { toast(tr('删除失败', 'Failed to delete')); return; }
          card.remove(); toast(tr('已删除', 'Deleted'));
          if (!plansEl.querySelector('.plan-card')) { empty(); searchEl.value = ''; searchEl.disabled = true; }
        };
        card.onclick = async () => {
          try {
            const r = await fetch(planURL(p.name)); if (!r.ok) throw 0;
            cloudLoad(await r.json(), p.name); mask.classList.remove('open');
          } catch (e) { toast(tr('读取失败', 'Failed to load')); }

      searchEl.oninput = () => {
        const q = searchEl.value.trim().toLocaleLowerCase();

        plansEl.querySelectorAll('.plan-card').forEach(card => {
          const show = card.dataset.name.includes(q);
          card.hidden = !show;

        });
        const noMatch = plansEl.querySelector('.search-empty');
        if (plans.length && q && !visible) {
          if (!noMatch) {
            const note = document.createElement('div'); note.className = 'muted search-empty';
            note.textContent = tr('没有匹配的方案', 'No matching plans');

          }
        } else if (noMatch) noMatch.remove();
      };
      /* 内置示例方案：点击载入画板（不入服务器，可「保存方案」留存） */
      const demo = document.createElement('div'); demo.className = 'plan-card demo';
      demo.innerHTML = `<div class="pc-thumb"><img src="/libs/demo-plan.png"></div><div class="pc-nm"></div><div class="pc-tm"></div>`;
      demo.querySelector('.pc-thumb img').alt = tr('示范户型 2D 预览', 'Demo floor plan 2D preview');
      demo.querySelector('.pc-nm').textContent = tr('示例：示范户型', 'Demo: sample floor plan');
      demo.querySelector('.pc-tm').textContent = tr('两居室参考案例，载入后可随意改造', 'A sample two-bedroom — load it and remodel freely');
      demo.onclick = () => {
        cloudLoad(defaultState(), '');
        mask.classList.remove('open');

      newCard.querySelector('.pc-nm').textContent = tr('新建空方案', 'New empty plan');
      newCard.querySelector('.pc-tm').textContent = tr('从空白画板开始设计', 'Start from a blank canvas');

            const a = p.g.rotation.y, px = p.g.position.x, pz = p.g.position.z, ex = px + Math.cos(a) * .9, ez = pz - Math.sin(a) * .9;
            const t = clamp01(((x - px) * (ex - px) + (z - pz) * (ez - pz)) / ((ex - px) ** 2 + (ez - pz) ** 2));
            if (Math.hypot(x - (px + t * (ex - px)), z - (pz + t * (ez - pz))) < r * .8) return true;
          }
          continue;
        }
        const a = d.pivot.rotation.y, px = d.pivot.position.x, pz = d.pivot.position.z, ex = px + Math.cos(a) * .9, ez = pz - Math.sin(a) * .9;
        const t = clamp01(((x - px) * (ex - px) + (z - pz) * (ez - pz)) / ((ex - px) ** 2 + (ez - pz) ** 2));
        if (Math.hypot(x - (px + t * (ex - px)), z - (pz + t * (ez - pz))) < r * .8) return true;
      }
      return false;
    }
    function stairH(x, z, ref) {                                 // 楼梯高度：取当前所在层（叠层楼梯同一位置上下两跑）
      const px = x * 1000 + 6000, py = z * 1000 + 5300, cand = [0];
      (state.stairs || []).forEach(s => {
        const a = s.dir * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
        const dx = px - s.x, dy = py - s.y, lx = dx * ca + dy * sa, ly = -dx * sa + dy * ca;
        const lay = stairLayout(s);
        lay.runs.forEach(r => {
          if (Math.abs(ly - r.z) > lay.w / 2) return;
          if (lx < Math.min(r.x0, r.x1) || lx > Math.max(r.x0, r.x1)) return;
          const t = r.dir > 0 ? (lx - r.x0) / (r.x1 - r.x0) : (r.x0 - lx) / (r.x0 - r.x1);
          cand.push((r.y0 + Math.max(0, Math.min(1, t)) * (r.y1 - r.y0)) / 1000);
        });
        lay.lands.forEach(L => {
          if (lx >= Math.min(L.x0, L.x1) && lx <= Math.max(L.x0, L.x1) && ly >= L.z0 && ly <= L.z1) cand.push(L.y / 1000);
        });
      });
      const base = ref ?? 0, near = cand.filter(v => v <= base + .55);   // 只认当前层高度附近的那一层，避免钻到上层去
      return near.length ? Math.max(...near) : Math.min(...cand);
    }
    let jumpV = 0, jumpY = 0;                                    // 漫游跳跃：竖直速度 / 离地高度（视高 1.6m + jumpY）
    function stepWalk(dt) {
      if (!walkCtl.isLocked && !touchWalk) return;
      if (keys.Space && jumpY <= 0 && jumpV <= 0) jumpV = 3.1;   // 空格起跳（按住落地自动连跳）
      if (jumpY > 0 || jumpV > 0) { jumpY += jumpV * dt; jumpV -= 9.5 * dt; if (jumpY <= 0) { jumpY = 0; jumpV = 0; } }
      camera.position.y = 1.6 + stairH(camera.position.x, camera.position.z, camera.position.y - 1.6 - jumpY) + jumpY;
      const sp = (keys.ShiftLeft || keys.ShiftRight ? 2.6 : 1.4) * dt, fwd = new THREE.Vector3();
      camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
      const right = new THREE.Vector3(-fwd.z, 0, fwd.x), mv = new THREE.Vector3();
      if (keys.KeyW || keys.ArrowUp) mv.add(fwd); if (keys.KeyS || keys.ArrowDown) mv.sub(fwd);
      if (keys.KeyD || keys.ArrowRight) mv.add(right); if (keys.KeyA || keys.ArrowLeft) mv.sub(right);
      if (touchWalk) { mv.addScaledVector(fwd, -joy.y).addScaledVector(right, joy.x); }
      const mag = Math.min(1, mv.length());        // 摇杆推得越远走得越快
      if (mag < .05) return;
      mv.normalize().multiplyScalar(sp * mag);
      const p = camera.position;
      if (!blocked(p.x + mv.x, p.z)) p.x += mv.x;
      if (!blocked(p.x, p.z + mv.z)) p.z += mv.z;
    }

    /* ======================= 射击彩蛋 ======================= */
    // 漫游模式点击射击：软弹珠打在墙面/家具上留下小凹痕（渐隐），带弹道与音效，纯视觉效果不改方案
    const fxList = [];
    let audioCtx = null;
    function shootFx(obj, life) {          // 加入特效队列，life 秒后渐隐移除（最多同时 26 个）
      fxList.push({ o: obj, t0: life, life }); scene.add(obj);
      if (fxList.length > 26) { const x = fxList.shift(); scene.remove(x.o); x.o.geometry?.dispose(); x.o.material?.dispose(); }
    }
    function shootSound() {                // WebAudio 合成短促「啪」声，无需音频文件
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime, n = audioCtx.createBufferSource();
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * .12 | 0, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.6);
        n.buffer = buf;
        const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 950;
        const g = audioCtx.createGain(); g.gain.setValueAtTime(.45, t); g.gain.exponentialRampToValueAtTime(.001, t + .12);
        n.connect(f).connect(g).connect(audioCtx.destination); n.start(t);
      } catch (err) { }
    }
    function shoot(e) {
      const r = renderer.domElement.getBoundingClientRect();
      ptr.set(e ? (e.clientX - r.left) / r.width * 2 - 1 : 0, e ? -((e.clientY - r.top) / r.height) * 2 + 1 : 0);
      ray.setFromCamera(ptr, camera);
      let hit = null;                                            // 漫游辅助线 / 玻璃 / 高亮层不挡子弹
      for (const h of ray.intersectObjects([archUp, archFloor, furnG], true)) {
        if (h.object.material === glassMat || h.object === doorHiRef || h.object.userData.walkOnly || h.object.isLine || h.object.isLineSegments) continue;
        hit = h; break;
      }
      const from = camera.position.clone().add(new THREE.Vector3(.12, -.09, 0).applyQuaternion(camera.quaternion));   // 枪口在视点右下
      const to = hit ? hit.point.clone() : ray.ray.at(9, new THREE.Vector3());
      const dir = to.clone().sub(from), len = Math.max(.05, dir.length());
      const tracer = new THREE.Mesh(new THREE.CylinderGeometry(.004, .004, len, 5), new THREE.MeshBasicMaterial({ color: '#ffd27f', transparent: true, opacity: .85 }));
      tracer.position.copy(from).addScaledVector(dir, .5); tracer.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
      shootFx(tracer, .09);
      if (hit && hit.face) {
        const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
        const hole = new THREE.Mesh(new THREE.CircleGeometry(.022, 12), new THREE.MeshBasicMaterial({ color: '#3a332b', transparent: true, opacity: .8 }));
        hole.position.copy(hit.point).addScaledVector(n, .012); hole.lookAt(hit.point.clone().add(n));
        shootFx(hole, 1.6);
        const puff = new THREE.Mesh(new THREE.SphereGeometry(.03, 8, 6), new THREE.MeshBasicMaterial({ color: '#e8dcc8', transparent: true, opacity: .7 }));
        puff.position.copy(hit.point).addScaledVector(n, .045);
        shootFx(puff, .22);
      }
      shootSound();
    }
    function stepFx(dt) {                  // 特效渐隐
      for (let i = fxList.length - 1; i >= 0; i--) {
        const f = fxList[i]; f.life -= dt;
        if (f.life <= 0) { scene.remove(f.o); f.o.geometry?.dispose(); f.o.material?.dispose(); fxList.splice(i, 1); }
        else if (f.o.material) f.o.material.opacity = Math.min(.85, .85 * f.life / f.t0 * 1.4);
      }
    }
    document.addEventListener('pointerdown', e => {              // 桌面漫游（鼠标锁定时点击 = 射击）
      if (active && opt.mode === 'walk' && walkCtl.isLocked && e.button === 0) shoot();
    });

    addEventListener('keydown', e => {
      if (!active || e.target.matches('input,select,textarea')) return;
      if (opt.mode === 'walk' && e.code === 'Space') e.preventDefault();   // 空格用于跳跃，阻止页面滚动
      keys[e.code] = true;
      if (opt.mode === 'walk' && e.code === 'KeyE') { const h = pick(); if (h?.door && h.dist < 2.5) h.door.open = !h.door.open; }
    });
    addEventListener('keyup', e => keys[e.code] = false);

    /* ======================= 工具栏 ======================= */
    function syncModeBtns() { document.querySelectorAll('#modes3d .btn').forEach(b => b.classList.toggle('on', b.dataset.mode === opt.mode)); }
    function syncCutBtns() { document.querySelectorAll('[data-cut]').forEach(b => b.classList.toggle('on', +b.dataset.cut === opt.cut)); }
    function syncWalkTexts() {
      const t = COARSE
        ? [tr('点击开始，从入户门进入', 'Tap to start at the front door'), tr('左下摇杆移动 · 在画面上拖动转向', 'Joystick moves · drag on screen to look'),
        tr('点门开关 · 点「退出漫游」回到鸟瞰', 'Tap doors to open · "Exit walk" returns to orbit')]
        : [tr('点击开始，从入户门进入', 'Click to start at the front door'),
        tr('<kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 移动 · 鼠标转向 · <kbd>Shift</kbd> 快走', '<kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move · mouse looks · <kbd>Shift</kbd> runs'),
        tr('<kbd>E</kbd> 开关正前方的门 · <kbd>空格</kbd> 跳跃 · <kbd>Esc</kbd> 暂停', '<kbd>E</kbd> opens the door ahead · <kbd>Space</kbd> jumps · <kbd>Esc</kbd> pauses')];
      t.forEach((h, i) => $('#wo' + (i + 1)).innerHTML = h);
      syncHint3d();
    }
    function bindUI() {
      document.querySelectorAll('#modes3d .btn').forEach(b => b.onclick = () => setMode(b.dataset.mode));
      // 触屏设备用摇杆漫游；桌面端锁定鼠标，锁定失败时也退回到摇杆
      $('#walkOverlay').onclick = () => COARSE ? startTouchWalk() : walkCtl.lock();
      document.addEventListener('pointerlockerror', () => { if (active && opt.mode === 'walk') startTouchWalk(); });
      $('#walkExit').onclick = () => setMode('orbit');
      bindJoystick();
      syncWalkTexts();
      $('#vIso').onclick = () => { if (opt.mode === 'walk') setMode('orbit'); else flyTo(isoWhole()); };
      $('#vTop').onclick = () => { if (opt.mode === 'walk') setMode('orbit'); flyTo(topWhole()); };
      document.querySelectorAll('[data-cut]').forEach(b => b.onclick = () => { if (opt.mode === 'walk') return; opt.cut = +b.dataset.cut; syncCutBtns(); sync(); });
      document.querySelectorAll('#toggles3d .btn').forEach(b => b.onclick = () => {
        const k = b.dataset.t; opt[k] = !opt[k]; b.classList.toggle('on', opt[k]);
        if (k === 'furn') { furnG.visible = opt.furn; if (!opt.furn && ui.sel?.kind === 'furn') window.select(null); }
        if (k === 'labels') showLabels(opt.labels && opt.mode === 'orbit' && !anim);
        if (k === 'night') applyLight();
      });
      $('#sun').oninput = e => { opt.hour = +e.target.value; applyLight(); };
    }

    /* ======================= 主循环 ======================= */
    const clock = new THREE.Clock();
    function startLoop() { if (!raf) { clock.getDelta(); raf = requestAnimationFrame(loop); } }
    // 漫游门交互提醒：准星瞄准门（<2.5m）→ 门扇高亮 + 准星下方提示按键 / 点击
    const walkTip = document.createElement('div'); walkTip.id = 'walkDoorTip'; document.body.appendChild(walkTip);
    function updateDoorWalkTip() {
      const walking = active && opt.mode === 'walk' && $('#walkOverlay').style.display !== 'flex';   // 未暂停
      const h = walking ? pick() : null;
      if (h?.door && h.dist < 2.5 && doorHiRef) {
        if (doorHiRef.parent !== h.mesh) {                          // 高亮挂到瞄准的门扇（随开门动画一起转）
          const p = h.mesh.geometry.parameters;
          doorHiRef.removeFromParent(); doorHiRef.visible = true;
          doorHiRef.scale.set(p.width * 1.05, p.height * 1.05, p.depth + .06);
          h.mesh.add(doorHiRef);
        }
        walkTip.textContent = touchWalk ? tr('点门开关', 'Tap to toggle') : tr('E 开关门', 'Press E to toggle');
        walkTip.classList.add('open');
      } else {
        if (doorHiRef) { doorHiRef.removeFromParent(); doorHiRef.visible = false; }
        walkTip.classList.remove('open');
      }
    }
    function loop() {
      raf = requestAnimationFrame(loop);
      const dt = Math.min(clock.getDelta(), .05), now = performance.now();
      if (anim) { const t = clamp01((now - anim.t0) / anim.dur); anim.fn(t); if (t >= 1) { const r = anim.res; anim = null; r(); } }
      else if (fly) { const t = clamp01((now - fly.t0) / fly.dur); camTween(fly.A, fly.B, ease(t)); if (t >= 1) fly = null; }
      else if (opt.mode === 'orbit') orbit.update();
      else stepWalk(dt);
      doors.forEach(d => { const tg = d.open ? (d.a1 ?? 1) : (d.a0 ?? 0); d.cur += (tg - d.cur) * Math.min(1, dt * 6); if (d.slide) d.pivots.forEach(p => p.g.position.set(p.px + p.ax * p.dist * d.cur, 0, p.pz + p.az * p.dist * d.cur)); else if (d.slat) d.grp.scale.y = Math.max(.02, d.cur); else if (d.fold) d.parts.forEach(p => p.g.rotation.y = p.a * d.cur); else d.pivot.rotation.y = d.cur; });   // slide = 电梯门双扇同步平移 / slat = 卷帘门向上卷收 / fold = 折叠门折起
      updateDoorWalkTip();
      stepFx(dt);
      updateSel();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    function shot() { const a = document.createElement('a'); a.download = tr('户型装修方案', 'floor-plan-design') + '-3D.png'; a.href = renderer.domElement.toDataURL('image/png'); a.click(); }

    function relang() { syncWalkTexts(); if (inited) buildLabels(); }

    window.View3D = { enter, exit, relang, sync: () => sync(), shot, groundAt, pick: (x, y) => pick({ clientX: x, clientY: y }), doorsRef: doors, flyToRoom: id => active && !anim && flyToRoom(id), walking: () => active && opt.mode === 'walk', __dbg: { get scene() { return archUp; } } };
  </script>
</body>
