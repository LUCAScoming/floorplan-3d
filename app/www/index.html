<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#fffdf9">
  <title>户型装修设计</title>
  <style>
    :root {
      --bg: #f3efe7;
      --paper: #f7f4ee;
      --panel: #fffdf9;
      --line: #e3dccf;
      --ink: #2b2824;
      --muted: #8a8174;
      --accent: #b5653a;
      --accent-soft: #f3e3d8;
      --teal: #2f5d62;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) 30px;
      grid-template-columns: 236px minmax(0, 1fr) 300px;
      height: 100vh;
      height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none
    }

    input {
      -webkit-user-select: text;
      user-select: text
    }

    header {
      grid-column: 1/-1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line)
    }

    .brand {
      display: flex;
      flex-direction: column;
      margin-right: 8px;
      line-height: 1.25
    }

    .brand b {
      font-size: 15px;
      letter-spacing: .5px
    }

    .brand span {
      color: var(--muted);
      font-size: 12px
    }

    .brand .tline {
      display: flex;
      align-items: center;
      gap: 8px
    }

    #planTag {
      max-width: 200px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding: 1px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f6f1e8;
      color: var(--ink);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.5
    }

    .grp {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff
    }

    .btn {
      border: 0;
      background: transparent;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap
    }

    .btn:hover {
      background: #f2ece2
    }

    .btn.on {
      background: var(--ink);
      color: #fff
    }

    .btn.chip.on {
      background: var(--accent-soft);
      color: var(--accent)
    }

    #langSel .btn {
      min-width: 32px;
      font-weight: 500
    }

    .btn.primary {
      background: var(--accent);
      color: #fff
    }

    .btn.primary:hover {
      background: #9f5530
    }

    .btn.danger {
      color: #b3372a
    }

    .spacer {
      flex: 1
    }

    aside {
      background: var(--panel);
      overflow: auto;
      border-right: 1px solid var(--line)
    }

    aside.right {
      border-right: 0;
      border-left: 1px solid var(--line)
    }

    .lib h4 {
      margin: 0;
      padding: 12px 14px 6px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 1px
    }

    .lib-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 0 10px 6px
    }

    /* 左侧选项夹：家具库 / 建筑工具 */
    .libtabs {
      display: flex;
      gap: 4px;
      padding: 10px 10px 8px;
      border-bottom: 1px solid var(--line)
    }

    .libtabs .btn.chip {
      flex: 1;
      text-align: center;
      border: 1px solid var(--line);
      background: #fff
    }

    .libtabs .btn.chip.on {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent)
    }

    .lib h4 {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--panel)
    }

    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 4px 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: grab;
      user-select: none;
      touch-action: pan-y;
      transition: border-color .15s, transform .15s
    }

    .item.dragging {
      border-color: var(--accent);
      opacity: .5
    }

    @media (hover:hover) {
      .item:hover {
        border-color: var(--accent);
        transform: translateY(-1px)
      }
    }

    #ghost {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 30;
      pointer-events: none;
      opacity: .8;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 4px 10px rgba(40, 30, 20, .3))
    }

    #ghost svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible
    }

    .item svg {
      width: 56px;
      height: 44px
    }

    .item b {
      font-weight: 500;
      font-size: 12px
    }

    .item small {
      color: var(--muted);
      font-size: 11px
    }

    .hint {
      padding: 10px 14px 16px;
      color: var(--muted);
      font-size: 12px
    }

    main {
      position: relative;
      overflow: hidden;
      background: var(--paper)
    }

    #plan {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: default
    }

    #stage.loading #plan {
      visibility: hidden
    }

    #stage.loading #view3d {
      visibility: hidden
    }

    #rotPad {
      position: absolute;
      right: 14px;
      top: 10px;
      z-index: 5;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .94);
      border: 1px solid var(--line);
      box-shadow: 0 2px 10px rgba(40, 30, 20, .14)
    }

    #rotPad .rotarrow {
      position: absolute;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #b3a99a;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      transition: background .18s, color .18s
    }

    #rotPad .rotarrow:hover {
      background: #f2ece2;
      color: var(--ink)
    }

    #rotPad .rotarrow.on {
      color: var(--accent)
    }

    #rotPad .up {
      left: 30px;
      top: 0
    }

    #rotPad .right {
      right: 0;
      top: 30px
    }

    #rotPad .down {
      left: 30px;
      bottom: 0
    }

    #rotPad .left {
      left: 0;
      top: 30px
    }

    #rotPad .rotcore {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: background .18s
    }

    #rotPad .rotcore:hover {
      background: #f6f1e8
    }

    #plan.panning {
      cursor: grabbing
    }

    #plan.tool-measure {
      cursor: crosshair
    }

    #plan.tool-draw {
      cursor: crosshair
    }

    #plan .wall {
      pointer-events: none
    }

    #plan.tool-draw[data-subtool="select"] .wall {
      cursor: pointer
    }

    #plan.tool-draw .wall {
      pointer-events: all
    }

    #plan.tool-draw[data-subtool="select"] .wall:hover {
      filter: brightness(1.08)
    }

    /* 设计-选择：空白处可拖出框选，用十字光标提示 */
    #plan.tool-draw[data-subtool="select"] [data-bg],
    #plan.tool-draw[data-subtool="select"] [data-room] {
      cursor: crosshair
    }

    #plan .open {
      cursor: move
    }

    #plan.tool-select .room:hover {
      opacity: .82
    }

    #plan .furn {
      cursor: move
    }

    @media (hover:hover) {
      #plan .furn:hover {
        filter: drop-shadow(0 0 2px rgba(181, 101, 58, .7))
      }
    }

    [data-handle] {
      cursor: pointer
    }

    [data-handle=size] {
      cursor: nwse-resize
    }

    [data-handle=rectSize][data-corner=nw],
    [data-handle=rectSize][data-corner=se] {
      cursor: nwse-resize
    }

    [data-handle=rectSize][data-corner=ne],
    [data-handle=rectSize][data-corner=sw] {
      cursor: nesw-resize
    }

    .scalebar {
      position: absolute;
      left: 14px;
      bottom: 12px;
      background: rgba(255, 253, 249, .92);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      pointer-events: none
    }

    .scalebar .bar {
      height: 6px;
      border: 1.5px solid var(--ink);
      border-top: 0;
      margin-top: 3px
    }

    .modehint {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none
    }

    .modehint.show {
      opacity: .9
    }

    /* 画板右下角的缩放 / 比例调整 */
    #zoomPad {
      position: absolute;
      right: 14px;
      bottom: 12px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255, 253, 249, .94);
      box-shadow: 0 2px 10px rgba(40, 30, 20, .12)
    }

    #zoomPad .btn {
      padding: 4px 8px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums
    }

    #stage.loading #zoomPad {
      visibility: hidden
    }

    @media (hover:hover) {
      #zoomPad .btn:hover {
        background: #f2ece2
      }
    }

    @media (pointer:coarse) {
      #zoomPad {
        right: 10px;
        bottom: 78px;
        padding: 4px
      }

      #zoomPad .btn {
        min-height: 34px;
        padding: 6px 9px
      }
    }

    /* 画板下方中间：直角 / 自由 绘制方向模式 */
    #dirPad {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255, 253, 249, .94);
      box-shadow: 0 2px 10px rgba(40, 30, 20, .12);
      transition: bottom .2s, opacity .2s;
      animation: none
    }

    #dirPad .btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 6px;
      color: var(--muted)
    }

    #dirPad .btn svg {
      width: 13px;
      height: 13px
    }

    #dirPad .btn.on {
      background: var(--accent-soft);
      color: var(--accent)
    }

    #stage.loading #dirPad {
      visibility: hidden
    }

    #dirPad[hidden] {
      display: none !important
    }

    #wallLenBox.open~#dirPad {
      bottom: 62px
    }

    #fab.show~#dirPad {
      opacity: 0;
      visibility: hidden
    }

    @media (hover:hover) {
      #dirPad .btn:hover {
        background: #f2ece2
      }
    }

    @media (pointer:coarse) {
      #dirPad {
        bottom: 14px;
        padding: 4px
      }

      #dirPad .btn {
        min-height: 34px;
        padding: 6px 12px
      }

      #wallLenBox.open~#dirPad {
        bottom: 66px
      }
    }

    footer {
      grid-column: 1/-1;
      display: flex;
      gap: 18px;
      align-items: center;
      padding: 0 14px;
      background: var(--panel);
      overflow: hidden;
      white-space: nowrap;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums
    }

    footer .copy {
      flex: none;
      margin-left: 10px;
      color: var(--muted)
    }

    footer .copy a {
      color: var(--teal, #3a7ca5);
      text-decoration: none
    }

    footer .copy a:hover {
      text-decoration: underline
    }

    #tip {
      overflow: hidden;
      text-overflow: ellipsis
    }

    footer b {
      color: var(--ink);
      font-weight: 500
    }

    #panel section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line)
    }

    #panel h3 {
      margin: 0 0 8px;
      font-size: 13px
    }

    #panel h3 small {
      color: var(--muted);
      font-weight: 400;
      margin-left: 6px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums
    }

    td {
      padding: 4px 2px;
      border-bottom: 1px dashed #eee6d9
    }

    td.r {
      text-align: right
    }

    tr.click {
      cursor: pointer
    }

    tr.click:hover td {
      background: #faf5ee
    }

    .sw {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, .15);
      vertical-align: -2px;
      margin-right: 6px
    }

    .total {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 14px
    }

    .total b {
      color: var(--accent)
    }

    .muted {
      color: var(--muted)
    }

    .form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .form label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 12px;
      color: var(--muted)
    }

    .form label.full {
      grid-column: 1/-1
    }

    .form label.chk {
      flex-direction: row;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      cursor: pointer
    }

    .form label.chk input {
      width: auto;
      margin: 0
    }

    .form input,
    .form select {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 7px;
      background: #fff;
      width: 100%
    }

    .form input[type=color] {
      padding: 2px;
      height: 30px
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px
    }

    .actions .btn {
      border: 1px solid var(--line);
      background: #fff
    }

    .actions .btn.on {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff
    }

    .mats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px
    }

    .mat {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
      background: #fff;
      cursor: pointer;
      text-align: left
    }

    .mat.on {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft)
    }

    .mat i {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      border: 1px solid rgba(0, 0, 0, .12);
      flex: none
    }

    .mat span {
      font-size: 12px;
      line-height: 1.3
    }

    .mat small {
      display: block;
      color: var(--muted)
    }

    .kbd {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 3px 10px;
      font-size: 12px;
      color: var(--muted)
    }

    kbd {
      font: 11px ui-monospace, Menlo, monospace;
      background: #f2ece2;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 0 5px;
      color: var(--ink)
    }

    .big {
      font-size: 22px;
      font-weight: 600;
      font-variant-numeric: tabular-nums
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 6px
    }

    .stats div {
      background: #faf6ef;
      border-radius: 8px;
      padding: 8px
    }

    .stats small {
      display: block;
      color: var(--muted);
      font-size: 11px
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 110px;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      opacity: 0;
      transition: .25s;
      pointer-events: none;
      z-index: 10
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%)
    }

    /* ---------- 服务器方案弹层 ---------- */
    #cloudMask {
      position: fixed;
      inset: 0;
      background: rgba(40, 30, 20, .35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 25
    }

    #cloudMask.open {
      display: flex
    }

    #cloudBox {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      width: min(440px, 92vw);
      max-height: 72vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 40px rgba(40, 30, 20, .25)
    }

    #cloudList {
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 40px
    }

    .cloud-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px;
      border-radius: 8px;
      cursor: pointer
    }

    .cloud-row .th {
      flex: none;
      width: 56px;
      aspect-ratio: 480 / 434;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f7f4ee;
      color: var(--muted);
      font-size: 10px
    }

    .cloud-row .th img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain
    }

    .cloud-row .info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .cloud-row .nm {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500
    }

    .cloud-row .tm {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap
    }

    /* 保存弹窗：已有方案标题固定，列表独立滚动 */
    #cloudList.rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
      min-height: 0
    }

    .cloud-sec-title {
      flex: none;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted)
    }

    .cloud-rows {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 1px
    }

    #cloudBox:not(.welcome) .welcome-sub {
      margin-bottom: 0
    }

    /* 保存方案弹窗：名称输入行 / 已有方案列表 / 底部按钮 / 选中行高亮 */
    #cloudNameRow {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 0
    }

    #cloudNameLabel {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted)
    }

    #cloudName {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      font: inherit;
      background: var(--paper);
      color: var(--ink);
      outline: none
    }

    #cloudName:focus {
      border-color: var(--accent)
    }

    #cloudFoot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px
    }

    .cloud-row.sel {
      background: var(--accent-soft)
    }

    .cloud-row:not(.sel):hover {
      background: var(--paper)
    }

    .cloud-row.sel .nm {
      color: var(--accent)
    }

    /* 弹窗右上角 X 关闭按钮 */
    #cloudX {
      position: absolute;
      top: 10px;
      right: 12px;
      border: none;
      background: none;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
      padding: 2px 6px;
      cursor: pointer;
      font-family: inherit
    }

    #cloudX:hover {
      color: var(--ink)
    }

    /* 欢迎界面（打开方案弹窗）：品牌标题 + 方案卡片网格 */
    #cloudBox.welcome {
      width: min(560px, 94vw)
    }

    .welcome-sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      margin-bottom: 10px
    }

    #cloudList.grid {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow: hidden
    }

    #cloudList.grid .cloud-actions,
    #cloudList.grid .cloud-plans {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px
    }

    #cloudList.grid .cloud-actions {
      flex: none
    }

    #cloudList.grid .cloud-plans {
      flex: 1 1 auto;
      align-content: start;
      min-height: 40px;
      overflow-y: auto;
      padding: 1px
    }

    #cloudList.grid .cloud-plans-title {
      flex: none;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .04em
    }

    #cloudSearch {
      flex: none;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      font: inherit;
      background: var(--paper);
      color: var(--ink);
      outline: none
    }

    #cloudSearch:focus {
      border-color: var(--accent)
    }

    #cloudList.grid .muted {
      grid-column: 1 / -1
    }

    .plan-card {
      position: relative;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: border-color .15s, background .15s
    }

    .plan-card:hover {
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .plan-card.action {
      border-style: dashed
    }

    .plan-card.action .pc-thumb {
      border-style: dashed;
      color: var(--accent);
      font-size: 38px
    }

    .plan-card.action .pc-nm {
      color: var(--accent)
    }

    .plan-card .pc-thumb {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 480 / 434;
      margin-bottom: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f7f4ee;
      color: var(--muted);
      font-size: 12px
    }

    .plan-card .pc-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain
    }

    .plan-card .pc-nm {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 14px
    }

    .plan-card.cur .pc-nm {
      color: var(--accent)
    }

    .pc-badge {
      display: inline-block;
      font-size: 10px;
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      padding: 1px 6px;
      margin-left: 6px;
      vertical-align: 1px
    }

    .plan-card .pc-tm {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px
    }

    .plan-card .pc-del {
      position: absolute;
      top: 6px;
      right: 8px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1;
      padding: 2px
    }

    .plan-card .pc-del:hover {
      color: #b3372a
    }

    .plan-card.demo {
      border-style: dashed;
      color: var(--teal)
    }

    .plan-card.demo:hover {
      border-color: var(--teal);
      background: var(--paper)
    }

    .plan-card.demo .pc-nm {
      color: var(--teal)
    }

    /* 应用内确认弹窗（替代原生 confirm） */
    #askMask {
      position: fixed;
      inset: 0;
      background: rgba(40, 30, 20, .35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60
    }

    #askMask.open {
      display: flex
    }

    #askBox {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      width: min(360px, 92vw)
    }

    #askMsg {
      white-space: pre-line;
      line-height: 1.6;
      font-weight: 500
    }

    #askFoot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff
    }

    /* ---------- 2D / 3D 切换 ---------- */
    .seg {
      position: relative;
      padding: 3px
    }

    .seg .btn {
      position: relative;
      z-index: 1;
      width: 82px;
      transition: color .45s
    }

    .seg .btn:hover {
      background: transparent
    }

    .seg .pill {
      position: absolute;
      left: 3px;
      top: 3px;
      bottom: 3px;
      width: 82px;
      border-radius: 6px;
      background: var(--accent);
      box-shadow: 0 2px 6px rgba(181, 101, 58, .35);
      transition: transform .5s cubic-bezier(.65, 0, .35, 1)
    }

    .seg .btn[data-view="2d"],
    body.m3d .seg .btn[data-view="3d"] {
      color: #fff
    }

    body.m3d .seg .btn[data-view="2d"] {
      color: var(--ink)
    }

    body.m3d .seg .pill {
      transform: translateX(84px)
    }

    body.busy .seg {
      pointer-events: none
    }

    body.m3d .only2d,
    body:not(.m3d) .only3d {
      display: none !important
    }

    /* 3D 模式：左侧固定显示房间列表（建筑工具只在 2D 设计模式有用） */
    body.m3d #libPaneFurn {
      display: block !important
    }

    .only2d,
    .only3d {
      animation: fadeIn .45s ease both
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    #plan {
      transition: opacity .45s ease, transform .45s ease
    }

    main.is3d #plan {
      opacity: 0;
      pointer-events: none
    }

    .scalebar {
      transition: opacity .3s
    }

    main.is3d .scalebar {
      opacity: 0
    }

    #view3d {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity .45s ease, visibility 0s linear .45s
    }

    main.is3d #view3d {
      opacity: 1;
      visibility: visible;
      transition: opacity .45s ease
    }

    #view3d canvas {
      display: block;
      outline: none
    }

    #walkOverlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(30, 28, 25, .35);
      z-index: 3;
      cursor: pointer
    }

    #walkOverlay>div {
      background: var(--panel);
      border-radius: 14px;
      padding: 22px 28px;
      text-align: center;
      max-width: 360px
    }

    #walkOverlay h3 {
      margin: 0 0 6px
    }

    #walkOverlay p {
      margin: 4px 0;
      color: var(--muted)
    }

    #cross {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      z-index: 2;
      display: none;
      pointer-events: none
    }

    #cross:before,
    #cross:after {
      content: "";
      position: absolute;
      background: #fff;
      box-shadow: 0 0 2px #000
    }

    #cross:before {
      left: 6px;
      top: 0;
      width: 2px;
      height: 14px
    }

    #cross:after {
      top: 6px;
      left: 0;
      height: 2px;
      width: 14px
    }

    #hint3d {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%);
      background: rgba(43, 40, 36, .82);
      color: #fff;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      z-index: 2;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity .4s
    }

    main.animating #hint3d {
      opacity: 0
    }

    .rlabel {
      font-size: 12px;
      font-weight: 600;
      color: #2b2824;
      background: rgba(255, 253, 249, .9);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 2px 9px;
      white-space: nowrap;
      pointer-events: none
    }

    .rlabel small {
      font-weight: 400;
      color: var(--muted);
      margin-left: 4px
    }

    #roomList {
      padding: 0 10px 6px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px
    }

    #roomList button {
      display: flex;
      flex-direction: column;
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      padding: 5px 8px;
      border-radius: 7px;
      cursor: pointer;
      text-align: left;
      line-height: 1.3
    }

    #roomList button:hover {
      background: #f2ece2
    }

    #roomList button.on {
      background: var(--accent-soft);
      color: var(--accent)
    }

    /* 3D 门交互提醒气泡 */
    #doorTip {
      position: fixed;
      z-index: 60;
      display: none;
      pointer-events: none;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 7px;
      transform: translate(16px, -34px);
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(40, 30, 20, .3)
    }

    #doorTip.open {
      display: block
    }

    /* 漫游模式门交互提示（准星下方） */
    #walkDoorTip {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 60;
      display: none;
      pointer-events: none;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 7px;
      transform: translate(-50%, 26px);
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(40, 30, 20, .3)
    }

    #walkDoorTip.open {
      display: block
    }

    #roomList small {
      color: var(--muted);
      font-variant-numeric: tabular-nums
    }

    .range {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 12px
    }

    .range input {
      width: 100px;
      accent-color: var(--accent)
    }

    .menu {
      position: relative
    }

    .menu summary {
      list-style: none;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 6px 12px
    }

    .menu summary::-webkit-details-marker {
      display: none
    }

    .menu-pop {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      display: flex;
      flex-direction: column;
      min-width: 150px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 4px;
      box-shadow: 0 10px 30px rgba(40, 30, 20, .14);
      z-index: 20;
      animation: fadeIn .2s ease
    }

    .menu-pop .btn {
      text-align: left
    }

    .menu-pop .sep {
      height: 1px;
      background: var(--line);
      margin: 4px 2px
    }

    .range span {
      font-variant-numeric: tabular-nums;
      color: var(--ink)
    }

    /* ---------- 选中后的浮动工具条 ---------- */
    #fab {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translate(-50%, 12px);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      background: rgba(255, 253, 249, .97);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 26px rgba(40, 30, 20, .16);
      z-index: 4;
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s, transform .2s, visibility 0s linear .2s;
      max-width: calc(100% - 24px)
    }

    main.drawer-panel #fab {
      opacity: 0;
      visibility: hidden
    }

    #fab.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
      transition: opacity .2s, transform .2s
    }

    #fab .name {
      padding: 0 8px 0 6px;
      font-weight: 600;
      max-width: 9em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    #fab .btn {
      border: 1px solid transparent
    }

    #fab .sep {
      width: 1px;
      align-self: stretch;
      margin: 4px 2px;
      background: var(--line)
    }

    /* ---------- 设计模式子工具（左侧「建筑工具」选项夹） ---------- */
    #designTools {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 2px;
      padding: 2px 10px 16px
    }

    .archhint {
      margin: 8px 10px 0;
      padding: 7px 9px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.45
    }

    #wallLenBox {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(255, 253, 249, .97);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 12px;
      z-index: 5;
      box-shadow: 0 6px 20px rgba(40, 30, 20, .15);
      font-size: 13px;
      white-space: nowrap
    }

    #wallLenBox.open {
      display: flex
    }

    #wallLen {
      width: 100px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      text-align: right
    }

    /* 旋转：角度输入框（与画墙长度框同款，在画板下方中间） */
    #rotAngleBox {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(255, 253, 249, .97);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 12px;
      z-index: 6;
      box-shadow: 0 6px 20px rgba(40, 30, 20, .15);
      font-size: 13px;
      white-space: nowrap
    }

    #rotAngleBox.open {
      display: flex
    }

    #rotAngle {
      width: 84px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      text-align: right
    }

    #rotAngleBox .btn {
      padding: 4px 10px;
      background: var(--accent);
      color: #fff
    }

    #rotAngleBox .btn:hover {
      background: #9f5530
    }

    /* ---------- 对象列表 / 属性（右侧栏两个选项夹） ---------- */
    aside.right {
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    .rightpane {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden
    }

    .rightpane[hidden] {
      display: none
    }

    #objPanel {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      font-size: 13px
    }

    #objPanel.open {
      display: flex
    }

    #panel {
      flex: 1;
      min-height: 0;
      overflow: auto
    }

    #objPanel .obj-head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      cursor: pointer;
      user-select: none
    }

    #objPanel .obj-toggle {
      margin-left: auto;
      color: var(--accent);
      font-size: 11px
    }

    #objPanel .obj-body {
      flex: 1;
      min-height: 0;
      overflow: auto
    }

    #objPanel .obj-head b {
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 2px;
      font-weight: 700
    }

    #objPanel h4 {
      margin: 7px 10px 2px;
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: 700;
      opacity: .85
    }

    #objPanel button[data-kind] {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      width: 100%;
      text-align: left;
      padding: 6px 10px;
      border: none;
      border-left: 2px solid transparent;
      background: none;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      font: inherit;
      color: var(--ink)
    }

    #objPanel button[data-kind]:hover {
      background: #f2ece2;
      border-left-color: var(--accent)
    }

    #objPanel button[data-kind].on {
      background: var(--accent-soft);
      border-left-color: var(--accent);
      color: var(--accent);
      font-weight: 600
    }

    #objPanel button[data-kind] small {
      color: var(--muted);
      font-weight: 400;
      white-space: nowrap;
      font-variant-numeric: tabular-nums
    }

    #objPanel button[data-kind].on small {
      color: var(--accent);
      opacity: .75
    }

    /* 房间名称内联输入框（浮在房间中心） */
    #roomNameInp {
      position: absolute;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 5;
      width: 170px;
      text-align: center;
      font: inherit;
      font-weight: 600;
      color: var(--ink);
      background: #fff;
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      padding: 5px 8px;
      box-shadow: 0 6px 18px rgba(40, 30, 20, .2);
      outline: none;
      user-select: text
    }

    #roomNameInp.open {
      display: block
    }

    #designTools .btn {
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1;
      text-align: left
    }

    #designTools .btn svg {
      width: 15px;
      height: 15px;
      flex: none;
      display: block
    }

    /* 分组：每组标题占整行，按钮两列排布 */
    #designTools .dtg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px
    }

    #designTools .dth {
      grid-column: 1/-1;
      padding: 6px 6px 1px;
      margin-top: 2px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
      letter-spacing: .8px
    }

    #designTools .dtg:first-of-type .dth {
      margin-top: 0;
      padding-top: 0;
      border-top: 0
    }

    #designTools .dtg .btn {
      width: 100%;
      min-width: 0;
      padding: 4px 6px
    }

    /* ---------- 触屏漫游摇杆 ---------- */
    #joy {
      position: absolute;
      left: 28px;
      bottom: 28px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255, 253, 249, .25);
      border: 2px solid rgba(255, 255, 255, .7);
      box-shadow: 0 4px 18px rgba(0, 0, 0, .18);
      z-index: 3;
      display: none;
      touch-action: none;
      backdrop-filter: blur(3px)
    }

    #joy i {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: rgba(255, 253, 249, .92);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
      pointer-events: none
    }

    #walkExit {
      position: absolute;
      right: 16px;
      bottom: 28px;
      z-index: 3;
      display: none
    }

    /* ---------- 触屏：加大点击区域 ---------- */
    @media (pointer:coarse) {
      body {
        font-size: 14px
      }

      header {
        padding: 8px 12px;
        gap: 8px
      }

      .grp {
        padding: 3px;
        border-radius: 10px
      }

      .btn {
        padding: 8px 12px;
        min-height: 38px;
        border-radius: 8px
      }

      .seg .btn,
      .seg .pill {
        width: 92px
      }

      body.m3d .seg .pill {
        transform: translateX(94px)
      }

      .menu summary {
        padding: 9px 14px
      }

      .menu-pop .btn {
        padding: 11px 14px
      }

      .item {
        padding: 10px 4px 8px
      }

      .form input,
      .form select {
        font-size: 16px;
        padding: 8px 9px
      }

      .form input[type=color] {
        height: 40px
      }

      .actions .btn,
      #fab .btn {
        min-height: 42px;
        padding: 9px 14px
      }

      td {
        padding: 7px 2px
      }

      #roomList button {
        padding: 8px 10px
      }

      .mat {
        padding: 9px 8px
      }

      .range input {
        width: 120px !important
      }
    }

    /* ---------- 竖屏 / 窄屏（如 iPad 竖握）：侧栏改为抽屉 ---------- */
    /* ---------- 宽屏：左右面板可收起 ---------- */
    @media (min-width:1101px) {
      .app {
        transition: grid-template-columns .3s cubic-bezier(.3, .7, .3, 1)
      }

      .app.hide-lib {
        grid-template-columns: 0 minmax(0, 1fr) 300px
      }

      .app.hide-panel {
        grid-template-columns: 236px minmax(0, 1fr) 0
      }

      .app.hide-lib.hide-panel {
        grid-template-columns: 0 minmax(0, 1fr) 0
      }

      .app.hide-lib aside.lib,
      .app.hide-panel aside.right {
        overflow: hidden;
        border: 0
      }

      aside {
        overflow-x: hidden
      }

      aside.lib>div {
        min-width: 220px
      }

      #panel {
        min-width: 284px
      }

      /* 收起动画中内容不被挤压变形 */
    }

    .narrow-only {
      display: none !important
    }

    @media (max-width:1100px) {
      .grp.narrow-only {
        display: flex !important
      }

      #fab .btn.narrow-only {
        display: inline-block !important
      }

        grid-template-columns: minmax(0, 1fr)
      }

      main,
      aside.lib,
      aside.right {
        grid-row: 2;
        grid-column: 1
      }

      aside.lib,
      aside.right {
        position: relative;
        z-index: 6;
        width: min(320px, 86vw);
        transition: transform .3s cubic-bezier(.3, .7, .3, 1), box-shadow .3s
      }

        transform: translateX(-110%)
      }

      aside.right {

        transform: translateX(110%)
      }

      }

      .lib-grid {
        grid-template-columns: 1fr 1fr 1fr
      }

      .brand span,
      footer .only2d {
        display: none !important
      }
    }

}}

          const by = py + ph + 110, bh = y + d - 15 - by;
          s += rc(x + 15, by, w - 30, bh, c, 'rx="40"') + pa(`M${x + 15} ${by + 300}H${x + w - 15}`, 'none', DASH);
          s += pa(`M${x + w - 15 - Math.min(420, w * .3)} ${by}L${x + w - 15} ${by}L${x + w - 15} ${by + Math.min(420, w * .3)}Z`, shade(c, 1.12));
          return s;
        }
        case 'sofa': case 'armchair': {
          const b = d * .24, a = Math.min(200, w * .13), n = t === 'armchair' ? 1 : (w > 2200 ? 3 : 2), cw = (w - 2 * a) / n, dk = shade(c, .85);
          let s = rc(x, y, w, d, dk, 'rx="60"');
          for (let i = 0; i < n; i++) s += rc(x + a + i * cw, y + b, cw, d - b - 40, c, 'rx="40"');
          return s + rc(x, y, w, b, dk, 'rx="50"') + rc(x, y, a, d, dk, 'rx="50"') + rc(x + w - a, y, a, d, dk, 'rx="50"');
        }
        case 'cornersofa': {
          const k = Math.min(950, d * .56, w * .4), b = 220, dk = shade(c, .85);
          let s = pa(`M${x} ${y}H${x + w}V${y + k}H${x + k}V${y + d}H${x}Z`, dk);
          const cw = (w - b - 200) / 2;
          s += rc(x + b, y + b, cw, k - b - 30, c, 'rx="40"') + rc(x + b + cw, y + b, cw, k - b - 30, c, 'rx="40"') + rc(x + b, y + k, k - b - 30, d - k - 200, c, 'rx="40"');
          return s + rc(x, y, w, b, dk, 'rx="50"') + rc(x, y, b, d, dk, 'rx="50"') + rc(x + w - 200, y, 200, k, dk, 'rx="50"') + rc(x, y + d - 200, k, 200, dk, 'rx="50"');
        }
        case 'nightstand': return rc(x, y, w, d, c, 'rx="30"') + `<circle r="${m * .24}" fill="#fff6dd" ${ST}/>` + `<circle r="${m * .08}" fill="${shade(c, .8)}" ${ST}/>`;
        case 'wardrobe': {
          let s = rc(x, y, w, d, c) + ln(x + 50, 0, x + w - 50, 0);
          for (let hx = x + 160; hx < x + w - 100; hx += 180) s += ln(hx - 45, -d * .28, hx + 45, d * .28, 'opacity=".6"');
          return s;
        }
        case 'cabinet': case 'shoecab': return rc(x, y, w, d, c) + ln(x, y + d, x + w, y);
        case 'dresser': return rc(x, y, w, d, c, 'rx="20"') + rc(x + w * .2, y, w * .6, 55, '#dfe9ee') + ec(0, d / 2 + 180, 160, 140, shade(c, .9));
        case 'desk': return rc(x, y, w, d, c, 'rx="20"') + rc(-w * .18, y + 50, w * .36, 45, '#555') + rc(-w * .14, y + d * .45, w * .28, d * .28, '#f4f4f4', 'rx="10"');
        case 'chair': return rc(x + 25, y + d * .16, w - 50, d * .84 - 10, c, 'rx="60"') + rc(x, y, w, d * .2, shade(c, .78), 'rx="40"');
        case 'bookshelf': { let s = rc(x, y, w, d, c); for (let bx = x + 400; bx < x + w - 50; bx += 400) s += ln(bx, y, bx, y + d); return s; }
        case 'baycushion': return rc(x, y, w, d, c, 'rx="60"') + rc(x + 60, y + 80, w - 120, Math.min(300, d * .2), '#fff', 'rx="60"') + rc(x + 60, y + d - 80 - Math.min(300, d * .2), w - 120, Math.min(300, d * .2), '#fff', 'rx="60"');
        case 'coffeetable': return rc(x, y, w, d, c, 'rx="80"') + rc(x + 60, y + 60, w - 120, d - 120, shade(c, 1.06), 'rx="50"');
        case 'tvstand': return rc(x, y, w, d, c) + rc(x + w * .15, y + 30, w * .7, 55, '#3a3a3a');
        case 'rug': return rc(x, y, w, d, c, 'rx="40" fill-opacity=".6"') + rc(x + 90, y + 90, w - 180, d - 180, 'none', 'rx="30" stroke-dasharray="3 3" opacity=".6"');
        case 'plant': {
          let s = `<circle r="${m / 2}" fill="${c}" fill-opacity=".85" ${ST}/>`;
          for (let k = 0; k < 8; k++) s += `<ellipse cx="0" cy="${-m * .27}" rx="${m * .1}" ry="${m * .21}" transform="rotate(${k * 45})" fill="${shade(c, .8)}" ${ST}/>`;
          return s + `<circle r="${m * .1}" fill="#8a6a4a" ${ST}/>`;
        }
        case 'table': return rc(x, y, w, d, c, 'rx="30"') + rc(x + 50, y + 50, w - 100, d - 100, 'none', 'rx="20" opacity=".4"');
        case 'roundtable': return ec(0, 0, w / 2, d / 2, c) + ec(0, 0, w / 2 - 50, d / 2 - 50, 'none', 'opacity=".4"');
        case 'counter': return rc(x, y, w, d, c) + ln(x, y + d - 40, x + w, y + d - 40, DASH);
        case 'stove': {
          let s = rc(x, y, w, d, '#2f2f2f', 'rx="20"'); const r = m * .26;
          const pts = w / d > 1.4 ? [[-w / 4, 0], [w / 4, 0]] : [[-w / 4, -d / 4], [w / 4, -d / 4], [-w / 4, d / 4], [w / 4, d / 4]];
          pts.forEach(([px, py]) => s += `<circle cx="${px}" cy="${py}" r="${r}" fill="none" stroke="#bbb" stroke-width="1" vector-effect="non-scaling-stroke"/><circle cx="${px}" cy="${py}" r="${r * .45}" fill="#666"/>`);
          return s;
        }
        case 'ksink': return rc(x, y, w, d, c, 'rx="20"') + rc(x + w * .06, y + d * .18, w * .42, d * .66, '#fff', 'rx="50"') + rc(x + w * .52, y + d * .18, w * .42, d * .66, '#fff', 'rx="50"') + `<circle cx="0" cy="${y + d * .09}" r="22" fill="#999"/>`;
        case 'fridge': return rc(x, y, w, d, c, 'rx="30"') + ln(x, y + d * .14, x + w, y + d * .14) + ln(0, y + d * .14, 0, y + d) + rc(-70, y + d * .5, 40, d * .25, '#aab') + rc(30, y + d * .5, 40, d * .25, '#aab');
        case 'toilet': return rc(x + w * .04, y, w * .92, d * .27, c, 'rx="30"') + ec(0, y + d * .27 + d * .36, w * .47, d * .36, c) + ec(0, y + d * .27 + d * .4, w * .3, d * .24, '#eef4f7');
        case 'vanity': return rc(x, y, w, d, c, 'rx="20"') + ec(0, y + d * .57, Math.min(w * .32, 260), d * .28, '#fff') + `<circle cx="0" cy="${y + d * .17}" r="26" fill="#999"/>`;
        case 'shower': return rc(x, y, w, d, c) + ln(x, y, x + w, y + d, DASH) + ln(x + w, y, x, y + d, DASH) + `<circle r="45" fill="#fff" ${ST}/>`;
        case 'bathtub': return rc(x, y, w, d, c, 'rx="40"') + rc(x + 80, y + 80, w - 160, d - 160, '#fff', `rx="${m * .33}"`) + `<circle cx="${x + w - 260}" cy="0" r="35" fill="#ccc" ${ST}/>`;
        case 'washer': case 'dryer': return rc(x, y, w, d, c, 'rx="30"') + rc(x, y, w, d * .14, shade(c, .9)) + `<circle cy="${d * .06}" r="${m * .34}" fill="#fff" ${ST}/><circle cy="${d * .06}" r="${m * .24}" fill="${t === 'dryer' ? '#e9dccb' : '#cfdde4'}" ${ST}/>`;
        case 'crib': {
          let s = rc(x, y, w, d, c, 'rx="20"') + rc(x + 45, y + 45, w - 90, d - 90, '#fff', 'rx="20"');
          for (let sx = x + 90; sx < x + w - 60; sx += 90) s += ln(sx, y, sx, y + 45, 'opacity=".5"') + ln(sx, y + d - 45, sx, y + d, 'opacity=".5"');
          return s;
        }
        case 'beanbag': return ec(0, 0, w / 2, d / 2, c) + ec(-w * .04, -d * .06, w * .3, d * .28, shade(c, 1.12), 'opacity=".9"');
        case 'sidetable': return ec(0, 0, w / 2, d / 2, c) + ec(0, 0, w * .12, d * .12, 'none', 'opacity=".5"');
        case 'floorlamp': return `<circle r="${m * .5}" fill="#fff6dd" fill-opacity=".85" ${ST}/>` + `<circle r="${m * .32}" fill="none" ${ST} ${DASH}/>` + `<circle r="${m * .07}" fill="${c}" ${ST}/>`;
        case 'island': return rc(x, y, w, d, c) + ln(x, y + d - 250, x + w, y + d - 250, DASH);
        case 'barstool': return `<circle r="${m / 2}" fill="${c}" ${ST}/><circle r="${m * .3}" fill="${shade(c, 1.15)}" ${ST}/>`;
        case 'waterheater': return rc(x, y, w, d, c, `rx="${d / 2}" ${DASH}`) + ln(x + w * .2, 0, x + w * .8, 0, DASH);
        case 'tv': return rc(x, y, w, d, c, 'rx="10"') + rc(x + w * .3, y + d, w * .4, Math.min(40, d), '#666');
        case 'aircon': return rc(x, y, w, d, c, 'rx="30"') + ln(x + 40, y + d * .72, x + w - 40, y + d * .72) + ln(x + 40, y + d * .86, x + w - 40, y + d * .86);
        case 'acwall': {
          let s = rc(x, y, w, d, c, `rx="30" ${DASH}`);
          [.25, .5, .75].forEach(k => s += ln(x + w * k, y + d, x + w * k, y + d + 200, `${DASH} opacity=".6"`));
          return s;
        }
        case 'dishwasher': return rc(x, y, w, d, c, 'rx="15"') + ln(x, y + d - 70, x + w, y + d - 70) + rc(x + w * .3, y + d - 45, w * .4, 25, '#888');
        case 'ovencol': return rc(x, y, w, d, c) + ln(x, y, x + w, y + d) + ln(x + w, y, x, y + d);
        case 'purifier': return rc(x, y, w, d, c, 'rx="60"') + rc(x + 45, y + 45, w - 90, d - 90, 'none', `rx="40" ${DASH}`);
        case 'officechair': {
          let s = '';
          for (let k = 0; k < 5; k++) s += `<line x1="0" y1="0" x2="0" y2="${m * .48}" transform="rotate(${k * 72 + 36})" stroke="#555" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
          return s + rc(x + w * .12, y + d * .22, w * .76, d * .66, c, 'rx="80"') + rc(x + w * .15, y + d * .04, w * .7, d * .16, shade(c, .78), 'rx="40"')
            + rc(x + w * .02, y + d * .3, w * .1, d * .45, shade(c, .7), 'rx="30"') + rc(x + w * .88, y + d * .3, w * .1, d * .45, shade(c, .7), 'rx="30"');
        }
        case 'piano': {
          let s = rc(x, y, w, d * .55, c, 'rx="10"') + rc(x + 40, y + d * .55, w - 80, d * .4, shade(c, 1.4), 'rx="10"');
          const kx = x + 90, kw = w - 180, kd = d * .2;
          s += rc(kx, y + d * .55, kw, kd, '#faf8f3');
          for (let i = 1; i < 26; i++) s += ln(kx + kw * i / 26, y + d * .55, kx + kw * i / 26, y + d * .55 + kd, 'opacity=".5"');
          return s;
        }
        case 'treadmill': return rc(x, y, w, d, c, 'rx="50"') + rc(x + 90, y + 320, w - 180, d - 400, '#1c1c1e', 'rx="25"') + rc(x, y, w, 230, shade(c, 1.4), 'rx="40"');
        default: return rc(x, y, w, d, c);
      }
    }

    /* ======================= 渲染 ======================= */
    const NOLABEL = ['plant', 'floorlamp', 'sidetable', 'barstool', 'beanbag'];
    function renderRooms() {
      let s = '';
      allRooms().forEach(r => {
        const st = state.rooms[r.id]; if (!st) return;   // 空方案：无房间地面
        s += `<polygon class="room" data-room="${r.id}" points="${r.poly.map(p => p.join(',')).join(' ')}" fill="url(#m-${st.mat})"/>`;
      });
      const sill = ([a, b, c, d]) => `<rect x="${a}" y="${b}" width="${c - a}" height="${d - b}" fill="#e2dacb" stroke="#b9b0a0" stroke-width="1" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
      DOORS.forEach((d, i) => { if (!bopenRemoved('d' + i)) s += sill(bopenDoor(i).rect); }); SLIDES.forEach((d, i) => { if (!bopenRemoved('s' + i)) s += sill(bopenRect('s' + i)); });
      $('#gRooms').innerHTML = s;
    }

    function renderFurn() {
      const g = $('#gFurn');
      g.setAttribute('display', ui.layers.furn ? 'inline' : 'none');
      g.innerHTML = state.furniture.map(f => {
        const fs = Math.max(80, Math.min(170, Math.min(f.w, f.d) * .2));
        const label = Math.min(f.w, f.d) >= 380 && !NOLABEL.includes(f.type)
          ? `<text transform="rotate(${-f.rot})" font-size="${fs}" text-anchor="middle" dominant-baseline="central" fill="#4a443c" opacity=".8" pointer-events="none">${esc(nm(f.name))}</text>` : '';
        return `<g class="furn" data-fid="${f.id}" transform="translate(${f.cx} ${f.cy}) rotate(${f.rot})">${furnSVG(f.type, f.w, f.d, f.color)}${label}</g>`;
      }).join('');
    }

    function renderWalls() {
      const dash = 'stroke="#c65b3a" stroke-width="1.2" stroke-dasharray="5 3" vector-effect="non-scaling-stroke"';
      const thin = 'stroke="#8f897d" stroke-width="1" vector-effect="non-scaling-stroke"';
      // 内置墙：按门 / 窗开口切成多段实墙
      const builtIn = WALLS.map((w, i) => {
        const id = 'w' + i;
        if (state.deletedWalls.includes(id)) return '';
        const k = wallTypeOf(i), dem = state.demolished.includes(id);
        let fill = k === 'b' ? (ui.layers.bearing ? '#b8412c' : '#26241f') : k === 'low' ? '#e9e3d8' : k === 'e' ? '#8f897d' : '#a7a195';
        let ex = k === 'low' ? thin : '';
        if (dem) { fill = 'rgba(198,91,58,.12)'; ex = dash; }
        const s = builtinSeg(i), segs = dem ? [[0, s.L]] : wallSegs(id, s.L);
        return segs.map(([c0, c1]) => s.hz
          ? `<rect class="wall" data-wall="${id}" x="${s.rect[0] + c0}" y="${s.rect[1]}" width="${c1 - c0}" height="${s.rect[3] - s.rect[1]}" fill="${fill}" ${ex}/>`
          : `<rect class="wall" data-wall="${id}" x="${s.rect[0]}" y="${s.rect[1] + c0}" width="${s.rect[2] - s.rect[0]}" height="${c1 - c0}" fill="${fill}" ${ex}/>`).join('');
      }).join('');
      // 自己画的墙：存中线 {a,b}，厚 240
      const drawn = state.walls.map(w => {
        const id = 'CW' + w.id;
        if (state.deletedWalls.includes(id)) return '';
        const dem = state.demolished.includes(id);
        const L = Math.hypot(w.b[0] - w.a[0], w.b[1] - w.a[1]);
        const k = cwType(w);
        const glassW = k === 'g' || k === 'lg';
        const fill = dem ? 'rgba(198,91,58,.12)' : k === 'b' ? (ui.layers.bearing ? '#b8412c' : '#26241f') : k === 'low' ? '#e9e3d8' : glassW ? (k === 'lg' ? '#e8f2f6' : '#dfeef4') : k === 'e' ? '#8f897d' : '#a7a195';
        const ex = dem ? dash : glassW ? 'stroke="#4f7394" stroke-width="1" vector-effect="non-scaling-stroke"' : thin;
        const segs = dem ? [[0, L]] : wallSegs(id, L);
        const e0 = segs.length && segs[0][0] === 0 ? wallEndExt(w, 0) : 0;                    // 端头接到别的墙 → 外扩补角
        const e1 = segs.length && segs[segs.length - 1][1] === L ? wallEndExt(w, 1) : 0;
        return segs.map(([c0, c1]) => {
          const c0x = c0 > 0 ? c0 : -e0, c1x = c1 < L ? c1 : L + e1;
          const [P0, P1] = segPts(w.a, w.b, c0x, c1x), T = cwT(w), g = cwGeom([P0[0], P0[1], P1[0], P1[1]], T);
          if (g.rot) return `<g class="wall" data-wall="${id}"><rect x="${-g.len / 2}" y="${-T / 2}" width="${g.len}" height="${T}" fill="${fill}" ${ex} transform="translate(${g.cx} ${g.cy}) rotate(${g.rot})"/></g>`;
          if (!g.w || !g.h) return '';
          return `<rect class="wall" data-wall="${id}" x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" fill="${fill}" ${ex}/>`;
        }).join('');
      }).join('');
      $('#gWalls').innerHTML = builtIn + drawn;
    }

    /* 窗花开关：窗上亮子（横向带框玻璃带）。用户门窗存 o.grille，内置窗存 state.bover['w'+i].grille，默认均无 */
    const openGrille = o => o.grille === true;

    function renderOpenings() {
      const WS = 'stroke="#4f7394" stroke-width="1" vector-effect="non-scaling-stroke"';
      let s = '';
      WINS.forEach((r0, i) => {
        if (bopenRemoved('w' + i) || bopenOnDeadWall('w' + i)) return;
        const r = bopenRect('w' + i);
        const [x0, y0, x1, y1] = r, w = x1 - x0, h = y1 - y0;
        s += `<g class="open" data-bopen="w${i}">`;
        s += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#f7fbfd" ${WS}/>`;
        if (w >= h) [1 / 3, 2 / 3].forEach(t => s += `<line x1="${x0}" y1="${y0 + h * t}" x2="${x1}" y2="${y0 + h * t}" ${WS}/>`);
        else[1 / 3, 2 / 3].forEach(t => s += `<line x1="${x0 + w * t}" y1="${y0}" x2="${x0 + w * t}" y2="${y1}" ${WS}/>`);
        s += `</g>`;
      });
      const DS = 'stroke="#3d3a34" stroke-width="1" vector-effect="non-scaling-stroke"';
      DOORS.forEach((d0, i) => {
        if (bopenRemoved('d' + i) || bopenOnDeadWall('d' + i)) return;
        const d = bopenDoor(i);
        const [hx, hy] = d.h, L = d.len, T = 40;
        const ox = hx + d.o[0] * L, oy = hy + d.o[1] * L, cx = hx + d.c[0] * L, cy = hy + d.c[1] * L;
        const sweep = d.o[0] * d.c[1] - d.o[1] * d.c[0] > 0 ? 1 : 0;
        const col = isEntry('d' + i) ? '#b5653a' : '#3d3a34';
        const [rx0, ry0, rx1, ry1] = d.rect;
        s += `<g class="open" data-bopen="d${i}">`;
        s += `<rect x="${Math.min(rx0, rx1)}" y="${Math.min(ry0, ry1)}" width="${Math.abs(rx1 - rx0)}" height="${Math.abs(ry1 - ry0)}" fill="#fff" fill-opacity="0" pointer-events="all"/>`;   // 整个门洞可点
        s += `<polygon points="${hx},${hy} ${ox},${oy} ${ox + d.c[0] * T},${oy + d.c[1] * T} ${hx + d.c[0] * T},${hy + d.c[1] * T}" fill="#fff" stroke="${col}" stroke-width="${isEntry('d' + i) ? 1.8 : 1}" vector-effect="non-scaling-stroke"/>`;
        s += `<path d="M${ox} ${oy}A${L} ${L} 0 0 ${sweep} ${cx} ${cy}" fill="none" ${DS} stroke-dasharray="5 3" opacity=".7"/>`;
        s += `</g>`;
      });
      SLIDES.forEach((s0, i) => {
        if (bopenRemoved('s' + i) || bopenOnDeadWall('s' + i)) return;
        const [x0, y0, x1, y1] = bopenRect('s' + i), v = s0.v;
        s += `<g class="open" data-bopen="s${i}">`;
        s += `<rect x="${Math.min(x0, x1)}" y="${Math.min(y0, y1)}" width="${Math.abs(x1 - x0)}" height="${Math.abs(y1 - y0)}" fill="#fff" fill-opacity="0" pointer-events="all"/>`;
        if (v) { const L = y1 - y0, m = (x0 + x1) / 2; s += `<rect x="${m - 45}" y="${y0}" width="40" height="${L * .55}" fill="#fff" ${DS}/><rect x="${m + 5}" y="${y1 - L * .55}" width="40" height="${L * .55}" fill="#fff" ${DS}/>`; }
        else { const L = x1 - x0, m = (y0 + y1) / 2; s += `<rect x="${x0}" y="${m - 45}" width="${L * .55}" height="40" fill="#fff" ${DS}/><rect x="${x1 - L * .55}" y="${m + 5}" width="${L * .55}" height="40" fill="#fff" ${DS}/>`; }
        s += `</g>`;
      });
      // 自己开的门 / 窗（data-open 使其可选中；整组可拖动沿墙滑动）
      state.openings.forEach(o => {
        const wg = openingWallGeom(o.wall); if (!wg) return;
        const { A, B, T } = wg;
        const [P0, P1] = segPts(A, B, o.c, o.c + o.w);
        const dx = P1[0] - P0[0], dy = P1[1] - P0[1], L = Math.hypot(dx, dy) || 1;
        const u = [dx / L, dy / L], n = [-u[1], u[0]], NE = 'pointer-events="none"';
        const g = cwGeom([P0[0], P0[1], P1[0], P1[1]]);
        const shape = inner => g.rot
          ? `<rect x="${-g.len / 2}" y="${-T / 2}" width="${g.len}" height="${T}" ${inner} transform="translate(${g.cx} ${g.cy}) rotate(${g.rot})"/>`
          : `<rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" ${inner}/>`;
        s += `<g class="open" data-open="${o.id}">`;
        if (o.kind === 'window' || o.kind === 'fwin' || o.kind === 'hwin') {   // 窗户 / 落地窗 / 高窗：双线窗符号（落地窗、高窗用更深的线色）
          const WS = (o.kind === 'fwin' || o.kind === 'hwin') ? 'stroke="#2e6e8e" stroke-width="1.2" vector-effect="non-scaling-stroke"' : 'stroke="#4f7394" stroke-width="1" vector-effect="non-scaling-stroke"';
          s += shape(`fill="#f7fbfd" ${WS}`);
          [-T / 6, T / 6].forEach(off => {
            const a = [P0[0] + n[0] * off, P0[1] + n[1] * off], b = [P1[0] + n[0] * off, P1[1] + n[1] * off];
            s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ${WS} ${NE}/>`;
          });
          if (openGrille(o)) {                               // 窗花：沿窗宽三等分的分格线（横跨墙厚）
            [1 / 3, 2 / 3].forEach(t => {
              const a = [P0[0] + dx * L * t - n[0] * T / 2, P0[1] + dy * L * t - n[1] * T / 2];
              s += `<line x1="${a[0]}" y1="${a[1]}" x2="${a[0] + n[0] * T}" y2="${a[1] + n[1] * T}" ${WS} ${NE}/>`;
            });
          }
        } else if (o.kind === 'louver') {                    // 百叶窗：双线窗符号 + 沿宽均分的叶片线（跨墙厚）
          const LS = 'stroke="#4f7394" stroke-width="1" vector-effect="non-scaling-stroke"';
          s += shape(`fill="#f7fbfd" ${LS}`);
          [-T / 6, T / 6].forEach(off => {
            const a = [P0[0] + n[0] * off, P0[1] + n[1] * off], b = [P1[0] + n[0] * off, P1[1] + n[1] * off];
            s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ${LS} ${NE}/>`;
          });
          const nL = Math.max(3, Math.round(L / 150));
          for (let k = 1; k < nL; k++) {
            const px = P0[0] + dx * L * k / nL, py = P0[1] + dy * L * k / nL;
            s += `<line x1="${px - n[0] * T / 2}" y1="${py - n[1] * T / 2}" x2="${px + n[0] * T / 2}" y2="${py + n[1] * T / 2}" ${LS} ${NE}/>`;
          }
        } else if (o.kind === 'cwin') {                      // 圆窗：以洞口中心画圆 + 圆心十字
          const CS = 'stroke="#2e6e8e" stroke-width="1.2" vector-effect="non-scaling-stroke"';
          const mm = [(P0[0] + P1[0]) / 2, (P0[1] + P1[1]) / 2], r = o.w / 2;
          s += `<circle cx="${mm[0]}" cy="${mm[1]}" r="${r}" fill="#f7fbfd" ${CS}/>`;
          s += `<line x1="${mm[0] - r}" y1="${mm[1]}" x2="${mm[0] + r}" y2="${mm[1]}" ${CS} ${NE}/>`;
          s += `<line x1="${mm[0]}" y1="${mm[1] - r}" x2="${mm[0]}" y2="${mm[1] + r}" ${CS} ${NE}/>`;
        } else if (o.kind === 'bay') {                       // 飘窗：洞口 + 向外凸出的窗台轮廓 + 三面窗线
          const BS = 'stroke="#2e6e8e" stroke-width="1.2" vector-effect="non-scaling-stroke"';
          const dep = Math.max(150, +(o.bayDepth ?? 600)), side = o.bayFlip ? -1 : 1;
          const ov = [n[0] * side, n[1] * side];
          const Q0 = [P0[0] + ov[0] * dep, P0[1] + ov[1] * dep], Q1 = [P1[0] + ov[0] * dep, P1[1] + ov[1] * dep];
          const inF = 70;                                     // 玻璃线离窗台外沿的距离
          const R0 = [Q0[0] - ov[0] * inF, Q0[1] - ov[1] * inF], R1 = [Q1[0] - ov[0] * inF, Q1[1] - ov[1] * inF];
          s += shape(`fill="#f7fbfd" ${BS}`);
          s += `<polygon points="${P0[0]},${P0[1]} ${Q0[0]},${Q0[1]} ${Q1[0]},${Q1[1]} ${P1[0]},${P1[1]}" fill="#f7fbfd" fill-opacity=".7" ${BS} ${NE}/>`;
          s += `<line x1="${R0[0]}" y1="${R0[1]}" x2="${R1[0]}" y2="${R1[1]}" ${BS} ${NE}/>`;
          [-T / 6, T / 6].forEach(off => {
            const a = [R0[0] + n[0] * off, R0[1] + n[1] * off], b = [R1[0] + n[0] * off, R1[1] + n[1] * off];
            s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ${BS} stroke-width=".8" ${NE}/>`;
          });
          [1 / 3, 2 / 3].forEach(t2 => {                      // 正面三等分分格线
            const px = R0[0] + (R1[0] - R0[0]) * t2, py = R0[1] + (R1[1] - R0[1]) * t2;
            s += `<line x1="${px}" y1="${py}" x2="${px + ov[0] * inF}" y2="${py + ov[1] * inF}" ${BS} stroke-width=".8" ${NE}/>`;
          });
        } else if (o.kind === 'slid') {                      // 落地推拉门：窗符号 + 中缝线（表示双扇）
          const SS = 'stroke="#2e6e8e" stroke-width="1" vector-effect="non-scaling-stroke"';
          s += shape(`fill="#f7fbfd" ${SS}`);
          [-T / 6, T / 6].forEach(off => {
            const a = [P0[0] + n[0] * off, P0[1] + n[1] * off], b = [P1[0] + n[0] * off, P1[1] + n[1] * off];
            s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ${SS} ${NE}/>`;
          });
          const sm = [(P0[0] + P1[0]) / 2, (P0[1] + P1[1]) / 2];
          s += `<line x1="${sm[0] - n[0] * T / 2}" y1="${sm[1] - n[1] * T / 2}" x2="${sm[0] + n[0] * T / 2}" y2="${sm[1] + n[1] * T / 2}" ${SS} ${NE}/>`;
        } else if (o.kind === 'sd') {                        // 单扇推拉门：双线洞口 + 贴一侧的单扇门板 + 轨道线
          const SS = 'stroke="#2e6e8e" stroke-width="1" vector-effect="non-scaling-stroke"';
          s += shape(`fill="#f7fbfd" ${SS}`);
          [-T / 6, T / 6].forEach(off => {
            const a = [P0[0] + n[0] * off, P0[1] + n[1] * off], b = [P1[0] + n[0] * off, P1[1] + n[1] * off];
            s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ${SS} ${NE}/>`;
          });
          const off = T * .26, th = Math.min(45, T * .34);
          const A2 = [P0[0] + n[0] * off, P0[1] + n[1] * off], B2 = [P1[0] + n[0] * off, P1[1] + n[1] * off];
          s += `<polygon points="${A2[0]},${A2[1]} ${B2[0]},${B2[1]} ${B2[0] + n[0] * th},${B2[1] + n[1] * th} ${A2[0] + n[0] * th},${A2[1] + n[1] * th}" fill="#fff" ${SS} ${NE}/>`;
        } else if (o.kind === 'fold') {                      // 折叠门：洞口内画连续折线（4 扇交替折向两侧）

          s += shape(`fill="#f4f1ea" ${FS}`);
          const N = 4, pts = [];
          for (let k = 0; k <= N; k++) {
            const t2 = k / N, off = (k === 0 || k === N) ? 0 : (k % 2 ? -1 : 1) * T * .3;
            pts.push(`${P0[0] + dx * t2 + n[0] * off},${P0[1] + dy * t2 + n[1] * off}`);
          }
          s += `<polyline points="${pts.join(' ')}" fill="none" ${FS} ${NE}/>`;
        } else if (o.kind === 'yak') {                        // 垭口：洞口 + 两端门套线（无门扇弧线）

          s += shape(`fill="#f2efe8" ${YS}`);
          [P0, P1].forEach(P => {
            s += `<line x1="${P[0] - n[0] * T * .55}" y1="${P[1] - n[1] * T * .55}" x2="${P[0] + n[0] * T * .55}" y2="${P[1] + n[1] * T * .55}" ${YS} ${NE}/>`;
          });
        } else if (o.kind === 'dble' || o.kind === 'zimu') {  // 双开门 / 子母门：两扇对开（子母门大扇在左）

            ? `fill="#e2dacb" stroke="#b5653a" stroke-width="1.8" vector-effect="non-scaling-stroke"`
            : `fill="#e2dacb" stroke="#b9b0a0" stroke-width="1" vector-effect="non-scaling-stroke"`);
          const side2 = o.flip ? -1 : 1, ov2 = [n[0] * side2, n[1] * side2], Tt2 = 40;
          (o.kind === 'dble' ? [.5, .5] : [.62, .38]).forEach((fr, i) => {
            const lw = o.w * fr, HP = i ? P1 : P0, ld = i ? [-u[0], -u[1]] : u;
            const oP = [HP[0] + ov2[0] * lw, HP[1] + ov2[1] * lw], cP = [HP[0] + ld[0] * lw, HP[1] + ld[1] * lw];
            const sweep = ov2[0] * ld[1] - ov2[1] * ld[0] > 0 ? 1 : 0;
            s += `<polygon points="${HP[0]},${HP[1]} ${oP[0]},${oP[1]} ${oP[0] + ld[0] * Tt2},${oP[1] + ld[1] * Tt2} ${HP[0] + ld[0] * Tt2},${HP[1] + ld[1] * Tt2}" fill="#fff" ${DS} ${NE}/>`;
            s += `<path d="M${oP[0]} ${oP[1]}A${lw} ${lw} 0 0 ${sweep} ${cP[0]} ${cP[1]}" fill="none" ${DS} stroke-dasharray="5 3" opacity=".7" ${NE}/>`;
          });
        } else if (o.kind === 'dwin') {                       // 门连窗：左侧门扇弧线 + 右侧固定窗双线
          s += shape(isEntry('O' + o.id)
            ? `fill="#e2dacb" stroke="#b5653a" stroke-width="1.8" vector-effect="non-scaling-stroke"`
            : `fill="#e2dacb" stroke="#b9b0a0" stroke-width="1" vector-effect="non-scaling-stroke"`);
          const dW = Math.min(900, o.w * .6), Pm = [P0[0] + u[0] * dW, P0[1] + u[1] * dW];
          const WS2 = 'stroke="#2e6e8e" stroke-width="1" vector-effect="non-scaling-stroke"';
          [-T / 6, T / 6].forEach(off => {
            const a = [Pm[0] + n[0] * off, Pm[1] + n[1] * off], b = [P1[0] + n[0] * off, P1[1] + n[1] * off];
            s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ${WS2} ${NE}/>`;
          });
          if (openGrille(o)) {                               // 窗花：窗段中缝分格线
            const gm = [(Pm[0] + P1[0]) / 2, (Pm[1] + P1[1]) / 2];
            s += `<line x1="${gm[0] - n[0] * T / 2}" y1="${gm[1] - n[1] * T / 2}" x2="${gm[0] + n[0] * T / 2}" y2="${gm[1] + n[1] * T / 2}" ${WS2} ${NE}/>`;
          }
          const side3 = o.flip ? -1 : 1, ov3 = [n[0] * side3, n[1] * side3], Tt3 = 40;
          const oP = [P0[0] + ov3[0] * dW, P0[1] + ov3[1] * dW], cP = [P0[0] + u[0] * dW, P0[1] + u[1] * dW];
          const sweep3 = ov3[0] * u[1] - ov3[1] * u[0] > 0 ? 1 : 0;
          s += `<polygon points="${P0[0]},${P0[1]} ${oP[0]},${oP[1]} ${oP[0] + u[0] * Tt3},${oP[1] + u[1] * Tt3} ${P0[0] + u[0] * Tt3},${P0[1] + u[1] * Tt3}" fill="#fff" ${DS} ${NE}/>`;
          s += `<path d="M${oP[0]} ${oP[1]}A${dW} ${dW} 0 0 ${sweep3} ${cP[0]} ${cP[1]}" fill="none" ${DS} stroke-dasharray="5 3" opacity=".7" ${NE}/>`;
        } else if (o.kind === 'roller') {                    // 卷帘门：洞口内画等距帘片线（垂直于墙轴）
          const RS = 'stroke="#8a6d3b" stroke-width="1" vector-effect="non-scaling-stroke"';
          s += shape(`fill="#efe9dd" ${RS}`);
          const mid = [(P0[0] + P1[0]) / 2, (P0[1] + P1[1]) / 2], nS = Math.max(2, Math.round(L / 200));
          for (let k = 1; k < nS; k++) {
            const x = (k / nS - .5) * L;
            s += `<line x1="${mid[0] + u[0] * x - n[0] * T / 2}" y1="${mid[1] + u[1] * x - n[1] * T / 2}" x2="${mid[0] + u[0] * x + n[0] * T / 2}" y2="${mid[1] + u[1] * x + n[1] * T / 2}" ${RS} ${NE}/>`;
          }
        } else if (o.kind === 'elev') {                      // 电梯门：金属底 + 中分双扇（两条扇面线 + 中缝）
          const ES = 'stroke="#6f7a80" stroke-width="1" vector-effect="non-scaling-stroke"';
          s += shape(`fill="#dfe3e6" ${ES}`);
          const mid = [(P0[0] + P1[0]) / 2, (P0[1] + P1[1]) / 2];
          [-T / 4, T / 4].forEach(off => {
            const a = [P0[0] + n[0] * off, P0[1] + n[1] * off], b = [P1[0] + n[0] * off, P1[1] + n[1] * off];
            s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" ${ES} ${NE}/>`;
          });
          s += `<line x1="${mid[0] - n[0] * T / 2}" y1="${mid[1] - n[1] * T / 2}" x2="${mid[0] + n[0] * T / 2}" y2="${mid[1] + n[1] * T / 2}" ${ES} ${NE}/>`;
        } else {
          s += shape(isEntry('O' + o.id)
            ? `fill="#e2dacb" stroke="#b5653a" stroke-width="1.8" vector-effect="non-scaling-stroke"`
            : `fill="#e2dacb" stroke="#b9b0a0" stroke-width="1" vector-effect="non-scaling-stroke"`);
          const side = o.flip ? -1 : 1, ov = [n[0] * side, n[1] * side], Tt = 40;
          const HP = o.hflip ? P1 : P0, ld = o.hflip ? [-u[0], -u[1]] : u;   // 铰链端与门扇沿墙方向
          const oP = [HP[0] + ov[0] * o.w, HP[1] + ov[1] * o.w], cP = [HP[0] + ld[0] * o.w, HP[1] + ld[1] * o.w];
          const sweep = ov[0] * ld[1] - ov[1] * ld[0] > 0 ? 1 : 0;
          s += `<polygon points="${HP[0]},${HP[1]} ${oP[0]},${oP[1]} ${oP[0] + ld[0] * Tt},${oP[1] + ld[1] * Tt} ${HP[0] + ld[0] * Tt},${HP[1] + ld[1] * Tt}" fill="#fff" ${DS} ${NE}/>`;
          s += `<path d="M${oP[0]} ${oP[1]}A${o.w} ${o.w} 0 0 ${sweep} ${cP[0]} ${cP[1]}" fill="none" ${DS} stroke-dasharray="5 3" opacity=".7" ${NE}/>`;
        }
        s += `</g>`;
      });
      // 入户标识：从门外指向入户门的简洁箭头（实心三角头 + 短杆），文字带浅色描边、不与杆重叠
      const eg = Object.keys(state.rooms).length ? entryGeom() : null;
      if (eg) {
        const u = eg.out, n = [-u[1], u[0]], R = v => Math.round(v);        // u = 门外方向：杆在门外，箭尖朝门内
        const tip = [eg.cx + u[0] * 260, eg.cy + u[1] * 260];              // 箭尖停在门洞外 260mm
        const hb = [tip[0] + u[0] * 400, tip[1] + u[1] * 400];             // 三角头底边中点（继续向外）
        const tl = [hb[0] + u[0] * 720, hb[1] + u[1] * 720];               // 杆尾
        s += `<line x1="${R(tl[0])}" y1="${R(tl[1])}" x2="${R(hb[0])}" y2="${R(hb[1])}" stroke="#b5653a" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
        s += `<polygon points="${R(tip[0])},${R(tip[1])} ${R(hb[0] + n[0] * 190)},${R(hb[1] + n[1] * 190)} ${R(hb[0] - n[0] * 190)},${R(hb[1] - n[1] * 190)}" fill="#b5653a" stroke="none"/>`;
        s += `<text x="${R(hb[0] + u[0] * 360 + n[0] * 300)}" y="${R(hb[1] + u[1] * 360 + n[1] * 300)}" font-size="205" font-weight="600" text-anchor="middle" fill="#b5653a" stroke="#fbf9f4" stroke-width="42" paint-order="stroke">${tr('入户', 'Entry')}</text>`;
      }

    }

    function renderPillars() {                              // 柱子：方柱画矩形、圆柱画圆（无填充图案，深灰实心）
      const g = $('#gPillars'); if (!g) return;
      g.innerHTML = (state.pillars || []).map(c => {
        const r = c.w / 2, on = ui.sel?.kind === 'pillar' && ui.sel.id === c.id;
        const st = `fill="#6f6455" stroke="${on ? '#b5653a' : '#4a4238'}" stroke-width="${on ? 2 : 1}" vector-effect="non-scaling-stroke"`;
        const body = c.round
          ? `<circle cx="${c.x}" cy="${c.y}" r="${r}" ${st}/>`
          : `<rect x="${c.x - r}" y="${c.y - r}" width="${c.w}" height="${c.w}" ${st}/>`;
        const hit = c.round ? body : `<rect x="${c.x - r}" y="${c.y - r}" width="${c.w}" height="${c.w}" fill="#fff" fill-opacity="0"/>`;
        return `<g class="pil" data-pillar="${c.id}">${hit}${body}</g>`;
      }).join('') + renderLifts2();
    }
    function renderLifts2() {                                   // 电梯：矩形井道 + 对角线 + 门洞缺口
      return (state.lifts || []).map(l => {
        const on = ui.sel?.kind === 'lift' && ui.sel.id === l.id;
        const w = Math.max(800, l.w ?? 2000), d = Math.max(800, l.d ?? 2000);
        const dw = Math.max(400, Math.min(w - 300, l.dw ?? 900)), hf = dw / 2;
        const col = on ? '#b5653a' : '#5f574b';
        const ln = `stroke="${col}" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="60 45"`;
        return `<g data-lift="${l.id}" style="cursor:move" transform="translate(${l.x} ${l.y}) rotate(${l.dir || 0})">
          <rect x="${-w / 2}" y="${-d / 2}" width="${w}" height="${d}" fill="#f1ede4" stroke="${col}" stroke-width="${on ? 2 : 1.2}" vector-effect="non-scaling-stroke"/>
          <line x1="${-w / 2}" y1="${-d / 2}" x2="${w / 2}" y2="${d / 2}" ${ln}/>
          <line x1="${-w / 2}" y1="${d / 2}" x2="${w / 2}" y2="${-d / 2}" ${ln}/>
          <line x1="${w / 2}" y1="${-d / 2}" x2="${w / 2}" y2="${-hf}" stroke="${col}" stroke-width="2.6" vector-effect="non-scaling-stroke"/>
          <line x1="${w / 2}" y1="${hf}" x2="${w / 2}" y2="${d / 2}" stroke="${col}" stroke-width="2.6" vector-effect="non-scaling-stroke"/>
          <line x1="${w / 2}" y1="${-hf}" x2="${w / 2 + 90}" y2="${-hf}" stroke="${col}" stroke-width="1" vector-effect="non-scaling-stroke"/>
          <line x1="${w / 2}" y1="${hf}" x2="${w / 2 + 90}" y2="${hf}" stroke="${col}" stroke-width="1" vector-effect="non-scaling-stroke"/>
        </g>
        <text x="${l.x}" y="${l.y + 70}" font-size="220" text-anchor="middle" fill="${col}" font-weight="600"
          stroke="#fbf9f4" stroke-width="45" paint-order="stroke" pointer-events="none">${tr('电梯', 'Lift')}</text>` +
          (Math.max(0, l.stop ?? 0) > 0 ? `<text x="${l.x}" y="${l.y + 330}" font-size="170" text-anchor="middle" fill="${col}" font-weight="500"
          stroke="#fbf9f4" stroke-width="40" paint-order="stroke" pointer-events="none">${tr('停靠 ', 'Stop ')}${(Math.round(l.stop / 10) / 100).toFixed(3)}</text>` : '');
      }).join('');
    }

    function stairLayout(s) {                                // 楼梯布局（mm，局部坐标：x 沿上行方向，y = 横向）
      if (s.type === 'ramp') { const f = s.flipX ? -1 : 1; return { N: 1, w: s.w, runs: [{ x0: -s.len / 2 * f, x1: s.len / 2 * f, dir: f, z: 0, n: 0, y0: 0, y1: s.rise ?? 600 }], lands: [], total: 0, unit: 0, ramp: true }; }
      if (s.type === 'steps') { const f = s.flipX ? -1 : 1; return { N: 1, w: s.w, runs: [{ x0: -s.len / 2 * f, x1: s.len / 2 * f, dir: f, z: 0, n: Math.max(1, s.steps || 3), y0: 0, y1: s.rise ?? 450 }], lands: [], total: 0, unit: 0, steps: true }; }
      const N = Math.max(1, Math.min(3, s.runs || 1)), gap = 100, w = s.w;
      const stack = !!(N === 3 && s.stack);                  // 正三跑：第三跑叠在第一跑正上方（平面只占两跑宽）
      const cols = stack ? 2 : N;
      const Wtot = cols * w + (cols - 1) * gap;              // 总宽（多跑并排，中间留 100 梯井）
      const land = w;                                        // 平台进深 = 梯宽
      const run = N === 1 ? s.len
        : N === 2 ? Math.max(600, s.len - land)
          : Math.max(600, s.len - 2 * land);                 // 三跑 / 正三跑：两端各一块平台，中间梯段同长
      const zc = i => -Wtot / 2 + w / 2 + i * (w + gap);
      const H = s.rise ?? 2800;
      const runs = [], lands = [];
      if (N === 1) {                                         // 直跑：一跑上行 →（可选）到达端平台：横向宽 1 / 2 梯宽，可左右偏半格
        const hasLand = s.land !== false;
        const xm = Math.max(-s.len / 2 + 600, s.len / 2 - (hasLand ? w : 0));
        runs.push({ x0: -s.len / 2, x1: xm, dir: 1, z: 0 });
        if (hasLand) {
          const dbl = s.landNum === 'double';
          const zw = dbl ? 2 * w : w;                         // 平台横向宽度：双平台 = 2 梯宽（单平台居中，不偏）
          const off = dbl ? (+s.landOff || 0) * w / 2 : 0;    // 偏向只对双平台生效（按半个梯宽平移，负 = 左）
          lands.push({ x0: xm, x1: s.len / 2, z0: off - zw / 2, z1: off + zw / 2, after: 0 });

      } else if (N === 2) {                                  // 双跑：一跑上行 → 端部平台 → 二跑折返上行
        const xm = -s.len / 2 + run;
        runs.push({ x0: -s.len / 2, x1: xm, dir: 1, z: zc(0) });
        runs.push({ x0: xm, x1: -s.len / 2, dir: -1, z: zc(1) });   // 折返：从平台边缘回到起点端
        lands.push({ x0: xm, x1: s.len / 2, z0: zc(0) - w / 2, z1: zc(1) + w / 2, after: 0 });
      } else if (stack) {                                    // 正三跑：一跑 → 远端平台 → 二跑折返 → 近端平台 → 三跑叠在一跑正上方
        const xs = -s.len / 2 + land, xe = xs + run;
        runs.push({ x0: xs, x1: xe, dir: 1, z: zc(0) });
        runs.push({ x0: xe, x1: xs, dir: -1, z: zc(1) });
        runs.push({ x0: xs, x1: xe, dir: 1, z: zc(0), upper: true });                       // 第三跑：与一跑同一列、正上方
        lands.push({ x0: xe, x1: s.len / 2, z0: zc(0) - w / 2, z1: zc(1) + w / 2, after: 0 });                    // 远端平台：接一跑顶
        lands.push({ x0: -s.len / 2, x1: xs, z0: zc(0) - w / 2, z1: zc(1) + w / 2, after: 1, upper: true });      // 近端平台：接二跑顶
        lands.push({ x0: xe, x1: s.len / 2, z0: zc(0) - w / 2, z1: zc(1) + w / 2, after: 2, upper: true });        // 第三平台：三跑顶，与远端平台同宽（落在上层楼面高度）
      } else {                                               // 三跑：近端平台 → 一跑 → 远端平台 → 二跑折返 → 近端平台 → 三跑 → 第三平台
        const xs = -s.len / 2 + land, xe = xs + run;
        runs.push({ x0: xs, x1: xe, dir: 1, z: zc(0) });
        runs.push({ x0: xe, x1: xs, dir: -1, z: zc(1) });
        runs.push({ x0: xs, x1: xe, dir: 1, z: zc(2) });
        lands.push({ x0: -s.len / 2, x1: xs, z0: zc(1) - w / 2, z1: zc(2) + w / 2, after: 1 });   // 近端平台：接第二跑顶
        lands.push({ x0: xe, x1: s.len / 2, z0: zc(0) - w / 2, z1: zc(1) + w / 2, after: 0 });     // 远端平台：接第一跑顶
        lands.push({ x0: xe, x1: s.len / 2, z0: zc(1) - w / 2, z1: zc(2) + w / 2, after: 2 });     // 第三平台：接第三跑顶（与近端平台同宽）
      }
      const want = Array.isArray(s.steps) ? s.steps : [];     // 每跑步数：可单独设（s.steps），否则按 260 进深自动
      const ns = runs.map((r, i) => {
        const v = Math.round(+want[i]);

      });

      if (runs.length) runs[runs.length - 1].y1 = H;
      lands.forEach(L => { L.y = runs[L.after] ? runs[L.after].y1 : H; });
      if (s.flipZ) {                                         // 左右翻转：折返侧互换（沿上行方向看，左手 ⇄ 右手）
        runs.forEach(r => r.z = -r.z);
        lands.forEach(L => { const a = -L.z1, b = -L.z0; L.z0 = a; L.z1 = b; });
      }
      if (s.flipX) {                                         // 前后翻转：起步端换到另一头（上楼方向反过来）
        runs.forEach(r => { r.x0 = -r.x0; r.x1 = -r.x1; r.dir = -r.dir; });

    function stairBBox(lay) {                                // 楼梯实际占地范围（局部坐标）

      lay.lands.forEach(L => { x0 = Math.min(x0, L.x0); x1 = Math.max(x1, L.x1); z0 = Math.min(z0, L.z0); z1 = Math.max(z1, L.z1); });
      return { x0, x1, z0, z1 };
    }

          o += `<text x="0" y="${z1 + 170}" text-anchor="middle" fill="#7a7164" style="font-size:130px">${tr(`台阶 ${n} 级`, `Steps ×${n}`)}</text>`;

    function renderLabels() {
